<title>Plantão Pleural</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#0e171d;--panel:#15232c;--panel2:#1c2e39;--line:#2b4250;--ink:#e6eff2;--muted:#94aab3;
  --accent:#5ad1c3;--accent-ink:#06211e;--warn:#f2b45a;--bad:#ef7d6d;--good:#7fd99a;
  --f-pixel:'Pixelify Sans','Courier New',monospace;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-body);margin:0;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto}
h1,h2,h3{font-family:var(--f-pixel);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 16px;font-weight:600;min-height:42px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 10px;min-height:34px;font-size:.85rem}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}

/* home */
.hero{display:grid;gap:14px;padding:18px 0 6px}
.hero h1{font-size:clamp(2.2rem,7vw,3.6rem);color:var(--accent);letter-spacing:.02em}
.hero p{max-width:58ch;color:var(--muted);font-size:1.02rem}
.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:22px}
.ccard{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:14px;text-align:left;display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:start;transition:border-color .15s,transform .15s}
.ccard:hover{border-color:var(--accent);transform:translateY(-2px)}
.ccard canvas{width:72px;height:72px;image-rendering:pixelated;border-radius:8px;background:var(--panel2)}
.ccard .n{font:500 .72rem var(--f-mono);color:var(--accent);letter-spacing:.08em}
.ccard h3{font-size:1.15rem;margin:2px 0 4px}
.ccard p{font-size:.88rem;color:var(--muted)}
.ccard .best{font:500 .75rem var(--f-mono);color:var(--warn);margin-top:6px;display:block}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:22px}
.how div{background:var(--panel);border-radius:10px;padding:12px 14px;font-size:.9rem;color:var(--muted)}
.how b{display:block;color:var(--ink);font-family:var(--f-pixel);font-size:1.05rem;margin-bottom:2px}
.foot{margin-top:26px;font-size:.8rem;color:var(--muted);max-width:72ch}

/* game */
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.hud .who{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.hud .who b{font-family:var(--f-pixel);font-size:1.15rem}
.clock{font:500 1rem var(--f-mono);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 10px;color:var(--warn)}
.hud .tools{display:flex;gap:6px;flex-wrap:wrap}
.stage{position:relative;border:3px solid var(--line);border-radius:10px;overflow:hidden;background:#000;max-width:100%}
#cv{display:block;width:100%;height:auto;image-rendering:pixelated;touch-action:manipulation;cursor:pointer}
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:grid;gap:6px;pointer-events:none;width:max-content;max-width:90%}
#toast div{background:rgba(10,20,26,.92);border:1px solid var(--accent);color:var(--ink);padding:6px 12px;border-radius:6px;font-size:.85rem;animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
#actBtn{position:absolute;right:10px;bottom:10px;background:var(--warn);color:#2a1a00;border:0;border-radius:8px;padding:8px 14px;font-family:var(--f-pixel);font-size:1rem;box-shadow:0 3px 0 #9c6a1d}
.ctrl{margin-top:10px;font-size:.85rem;color:var(--muted)}
.ctrl kbd{font-family:var(--f-mono);background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:.78rem;color:var(--ink)}

/* modal */
#modal{position:fixed;inset:0;background:rgba(3,8,11,.72);display:flex;align-items:flex-end;justify-content:center;z-index:50;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
@media(min-width:700px){#modal{align-items:center}}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:14px;width:100%;max-width:800px;max-height:100%;display:flex;flex-direction:column;box-shadow:0 20px 50px -20px #000}
.panel header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel header h2{font-size:1.3rem}
.panel .x{background:var(--panel2);border:1px solid var(--line);border-radius:8px;width:38px;height:38px;font-size:1.1rem}
.pbody{padding:14px 16px 18px;overflow-y:auto;min-height:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:.85rem}
.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.talk{display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;align-items:start}
.talk canvas{width:88px;height:88px;image-rendering:pixelated;border-radius:10px;background:var(--panel2);border:2px solid var(--line)}
.bubble{background:#f4efe2;color:#1d2328;border-radius:12px;padding:12px 14px;min-height:64px;font-size:.98rem;position:relative}
.bubble::before{content:"";position:absolute;left:-8px;top:18px;border:8px solid transparent;border-right-color:#f4efe2;border-left:0}
.bubble .nm{display:block;font:700 .9rem var(--f-pixel);color:#3c6e68;margin-bottom:2px}
.qcat{margin-top:12px}
.talktop{position:sticky;top:-14px;margin:10px -16px 0;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);z-index:2}
.qtabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.qtabs button{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:6px 11px;font-size:.84rem}
.qtabs button small{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);margin-left:2px}
.qtabs button.on{background:var(--warn);color:#2a1a00;border-color:var(--warn);font-weight:600}
.qtabs button.on small{color:#5a3a00}
.qlist{margin-top:12px;flex-direction:column;align-items:stretch}
.qlist .chip{padding:10px 12px}
@media(max-width:699px){.qtabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:-16px;padding-right:16px}.qtabs button{flex:none}}
.qcat h4{margin:0 0 6px;font:500 .7rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:.88rem;text-align:left}
.chip:hover{border-color:var(--accent)}
.chip.done{opacity:.5}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);opacity:1}
.examgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:10px}
.fig{background:var(--panel2);border-radius:10px;padding:8px;text-align:center}
.fig h4{margin:0 0 4px;font:500 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fig svg{width:100%;max-width:260px;height:auto}
.zone{fill:rgba(90,209,195,.08);stroke:rgba(90,209,195,.35);stroke-width:1;cursor:pointer;transition:fill .12s}
.zone:hover{fill:rgba(90,209,195,.3)}
.zone.hit{fill:rgba(242,180,90,.22)}
.space{fill:transparent;cursor:pointer}
.space:hover{fill:rgba(90,209,195,.25)}
.space.sel{fill:rgba(242,180,90,.55)}
.flog{margin-top:12px;display:grid;gap:6px}
.flog div{background:var(--panel2);border-left:3px solid var(--accent);border-radius:6px;padding:7px 10px;font-size:.9rem}
.flog div b{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);display:block;font-weight:500}
.list{display:grid;gap:6px}
.check{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;font-size:.92rem}
.check input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.check .tm{margin-left:auto;font:500 .75rem var(--f-mono);color:var(--muted);white-space:nowrap}
.res{background:var(--panel2);border-radius:8px;padding:9px 12px;font-size:.92rem}
.res b{display:block;font:500 .75rem var(--f-mono);color:var(--muted);font-weight:500}
.res .v{font-family:var(--f-mono)}
.res.wait .v{color:var(--muted);font-style:italic}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.note{background:rgba(242,180,90,.12);border-left:3px solid var(--warn);border-radius:6px;padding:9px 12px;font-size:.9rem;margin-top:10px}
.event{background:rgba(239,125,109,.12);border-left:3px solid var(--bad);border-radius:6px;padding:9px 12px;font-size:.92rem;margin-top:10px}
.okmsg{background:rgba(127,217,154,.12);border-left:3px solid var(--good);border-radius:6px;padding:9px 12px;font-size:.92rem;margin-top:10px}
.opts{display:grid;gap:6px;margin-top:8px}
.opts label{display:flex;gap:8px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.9rem;cursor:pointer}
.opts input{accent-color:var(--accent);margin-top:3px}
.tapwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media(max-width:640px){.tapwrap{grid-template-columns:minmax(0,1fr)}}
.tapwrap svg{width:100%;height:auto;background:#d9c2a8;border-radius:10px}
.rxbox{display:flex;justify-content:center;background:#000;border-radius:10px;padding:10px}
.rxbox canvas{width:100%;max-width:320px;height:auto}
.calc{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.calc input{flex:1 1 200px;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--ink);font:500 1rem var(--f-mono)}
.calcout{font:500 1.2rem var(--f-mono);color:var(--warn);margin-top:8px;min-height:1.6em}
h3.sec{font-size:1.05rem;margin:16px 0 8px}

/* debrief */
.deb{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:20px}
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .big{font:700 4.4rem/1 var(--f-pixel);color:var(--accent)}
.bars{display:grid;gap:8px;margin:16px 0}
.bar{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;font-size:.9rem}
@media(max-width:480px){.bar{grid-template-columns:96px 1fr 46px}}
.bar .tr{height:10px;background:var(--panel2);border-radius:5px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--accent)}
.bar .nm{font-family:var(--f-mono);text-align:right;font-size:.8rem}
.miss{display:grid;gap:6px}
.miss li{font-size:.9rem}
.cond{display:grid;gap:6px}
.cond div{background:var(--panel2);border-radius:8px;padding:9px 12px;border-left:3px solid var(--line);font-size:.92rem}
.cond .ok{border-color:var(--good)}.cond .no{border-color:var(--bad)}.cond .mi{border-color:var(--warn)}
.cond small{display:block;color:var(--muted);margin-top:2px}
.learn{display:grid;gap:10px}
.learn div{border-left:3px solid var(--accent);padding-left:12px}
.learn b{font-family:var(--f-pixel);font-size:1.02rem}

/* casos da IA */
.iabox{background:var(--panel);border:2px dashed var(--line);border-radius:12px;padding:16px;margin-top:22px;display:grid;gap:8px}
.iabox h2{font-size:1.3rem;color:var(--accent)}
.iabox .lbl{font:500 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.iabox textarea,.iabox select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--ink);font:400 .95rem var(--f-body);padding:9px 12px;width:100%;resize:vertical}
.iabox select{width:auto;min-height:42px}
.iabox .row{margin-top:4px}
.filebtn{position:relative;display:inline-flex;align-items:center;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-size:inherit}
.iastatus{display:grid;gap:6px}
.iastatus .note,.iastatus .event,.iastatus .okmsg{margin-top:0}
.iawait{font-size:.9rem;color:var(--warn);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.modh{font-size:1.25rem;margin-top:24px;color:var(--warn)}
.modh+.cases{margin-top:10px}
.mtit{margin:14px 0 6px;font:500 .7rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.zlbl text{font:600 7px var(--f-mono);fill:#3b2a1c;pointer-events:none}
.zlbl text.out{fill:#cfe0e6}
.ouvir{display:inline-flex;align-items:center;gap:4px;margin-top:6px;background:var(--panel);border:1px solid var(--accent);color:var(--accent);border-radius:99px;padding:4px 12px;font:600 .8rem var(--f-body);min-height:32px}
.ouvir:hover{background:var(--accent);color:var(--accent-ink)}
.flog div .ouvir{display:flex;width:max-content}

/* exame: último achado fixo no rodapé; no celular, uma figura por vez */
.figtabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.figtabs button small{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);margin-left:2px}
.figtabs button.on small{color:#5a3a00}
.examgrid [data-fig]:not(.fig-on),.manobras:not(.fig-on){display:none}
.examgrid{grid-template-columns:minmax(0,1fr)}
.figtabs+.tapwrap,.figtabs+p,.figtabs+.okmsg{margin-top:12px}
.figtabs button{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:.85rem}
.figtabs button.on{background:var(--warn);color:#2a1a00;border-color:var(--warn);font-weight:600}
.ultimo{position:sticky;bottom:-18px;margin:12px -16px -18px;padding:10px 16px 14px;background:var(--panel);border-top:2px solid var(--accent);box-shadow:0 -10px 20px -12px #000;z-index:2}
.ultimo>div{background:var(--panel2);border-left:3px solid var(--warn);border-radius:6px;padding:7px 10px;font-size:.92rem}
.ultimo>div b{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);display:block;font-weight:500}
.ultimo .ouvir{display:flex;width:max-content}
@media(max-width:699px){
 .figtabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:-16px;padding-right:16px}.figtabs button{flex:none}
 .fig svg{max-width:230px}
}
</style>

<div class="wrap">
  <section id="home"></section>
  <section id="game" hidden>
    <div class="hud">
      <div class="who"><b id="hudCase"></b><span class="clock" id="hudClock">19:00</span></div>
      <div class="tools">
        <button class="btn ghost small" data-hud="notes">Caderneta</button>
        <button class="btn ghost small" data-hud="wait">Esperar 15 min</button>
        <button class="btn ghost small" data-hud="help">Ajuda</button>
        <button class="btn ghost small" data-hud="quit">Sair</button>
      </div>
    </div>
    <div class="stage">
      <canvas id="cv" width="480" height="288" aria-label="Sala de emergência"></canvas>
      <div id="toast"></div>
      <button id="actBtn" hidden></button>
    </div>
    <p class="ctrl">Ande com <kbd>WASD</kbd> ou setas, interaja com <kbd>E</kbd>. No celular, toque no lugar ou na pessoa para ir até lá. <kbd>N</kbd> abre a caderneta.</p>
  </section>
  <section id="debrief" hidden></section>
</div>
<div id="modal" hidden><div class="panel" role="dialog" aria-modal="true"><header><h2 id="mTitle"></h2><button class="x" data-m="close" aria-label="Fechar">✕</button></header><div class="pbody" id="mBody"></div></div></div>

<script>
// ---- js/dados.js ----
/* Dados compartilhados por todos os casos: perguntas, exames, análises do líquido, diagnósticos e personagens. */
const QUESTIONS=[
 {id:'queixa',cat:'Queixa',t:'O que trouxe você aqui hoje?'},

 {id:'tratou',cat:'Queixa',t:'Já tomou algum remédio para isso?'},
 {id:'febre',cat:'Geral',t:'Teve febre? Em que horário?'},
 {id:'peso',cat:'Geral',t:'Perdeu peso? Sua à noite?'},

 {id:'infancia',cat:'Antecedentes',t:'Teve alguma doença séria quando era criança?'},
 {id:'transfusao',cat:'Antecedentes',t:'Já recebeu transfusão de sangue?'},
 {id:'imob',cat:'Antecedentes',t:'Fez cirurgia, viagem longa ou ficou muito tempo de cama?'},
 {id:'familia',cat:'Antecedentes',t:'Tem alguma doença na família?'},
 {id:'habitos',cat:'Hábitos e vida',t:'Bebe ou fuma?'},
 {id:'contato',cat:'Hábitos e vida',t:'Alguém perto de você está doente ou tossindo?'},

 {id:'estimulantes',cat:'Hábitos e vida',t:'Toma café, energético ou algum remédio estimulante ou para emagrecer?'},
 {id:'hiv',cat:'Hábitos e vida',t:'Já fez teste de HIV? Usa preservativo?'}
];
const EXAMS=[
 {id:'hemo',t:'Hemograma',d:30},{id:'pcr',t:'Proteína C reativa',d:30},
 {id:'renal',t:'Ureia e creatinina',d:30},{id:'hep',t:'TGO, TGP e bilirrubinas',d:30},

// ---- js/sons.js ----
/* Sons de ausculta e de percussão sintetizados no navegador (Web Audio), sem gravações.
   O som sai do texto do achado: o que o caso descreve é o que se ouve.
   somDoAchado(texto, zona, caso) → descrição do som (ou null); tocarSom(som) toca uns segundos. */
const SOM={ctx:null,ruido:null,saida:null};

function somCtx(){
 if(!SOM.ctx){
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
  SOM.ctx=new AC();
  const n=SOM.ctx.sampleRate*2,b=SOM.ctx.createBuffer(1,n,SOM.ctx.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  SOM.ruido=b;
 }
 if(SOM.ctx.state==='suspended')SOM.ctx.resume();
 return SOM.ctx;
}

/* ---------- peças do som ---------- */
// batida grave (bulhas): seno que cai de frequência + um pouco de ruído grave
function batida(a,out,t,f,dur,amp){
 if(amp<=0)return;
 const o=a.createOscillator(),g=a.createGain();
 o.frequency.setValueAtTime(f*1.4,t);o.frequency.exponentialRampToValueAtTime(f,t+dur*.6);
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(.55*amp,t+.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
 o.connect(g).connect(out);o.start(t);o.stop(t+dur+.02);
 ruido(a,out,t,dur*.7,{tipo:'lowpass',f:160,q:.7},[[0,0],[.1,1],[1,0]],.35*amp);
}
// ruído filtrado com envelope (sopros, murmúrio, atritos). env = [[fração do tempo, nível 0..1], ...]
function ruido(a,out,t,dur,filtro,env,amp){
 if(amp<=0||dur<=0)return;
 const s=a.createBufferSource();s.buffer=SOM.ruido;s.loop=true;
 const fl=a.createBiquadFilter();fl.type=filtro.tipo||'bandpass';fl.frequency.value=filtro.f;fl.Q.value=filtro.q||1;
 const g=a.createGain();g.gain.setValueAtTime(0,t);
 env.forEach(([x,v])=>g.gain.linearRampToValueAtTime(v*amp,t+x*dur));
 let n=s.connect(fl);
 if(filtro.f2){const f2=a.createBiquadFilter();f2.type='bandpass';f2.frequency.value=filtro.f2;f2.Q.value=filtro.q2||8;n=n.connect(f2);}
 n.connect(g).connect(out);
 s.start(t,Math.random()*1.5);s.stop(t+dur+.02);
}
// estalo curto (clique, estalido, crepitantes)
function estalo(a,out,t,f,dur,amp){ruido(a,out,t,dur,{tipo:'bandpass',f,q:1.2},[[0,0],[.15,1],[1,0]],amp);}
// tom (sibilos, roncos, tilintar)
function tom(a,out,t,dur,f,amp,forma){
 const o=a.createOscillator(),g=a.createGain();o.type=forma||'sine';o.frequency.value=f;
 o.frequency.linearRampToValueAtTime(f*0.94,t+dur);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(amp,t+dur*.2);g.gain.linearRampToValueAtTime(amp*.8,t+dur*.8);g.gain.linearRampToValueAtTime(0,t+dur);
 let n=o;if(forma==='sawtooth'){const fl=a.createBiquadFilter();fl.type='lowpass';fl.frequency.value=380;n=o.connect(fl);}
 n.connect(g).connect(out);o.start(t);o.stop(t+dur+.02);
}
// borbulho intestinal: ruído com frequência subindo e tremor
function borbulho(a,out,t,dur,amp,agudo){
 const s=a.createBufferSource();s.buffer=SOM.ruido;s.loop=true;
 const fl=a.createBiquadFilter();fl.type='bandpass';fl.Q.value=6;
 const f0=agudo?500:220;fl.frequency.setValueAtTime(f0,t);fl.frequency.linearRampToValueAtTime(f0*2.4,t+dur);
 const g=a.createGain();g.gain.setValueAtTime(0,t);
 const lfo=a.createOscillator(),lg=a.createGain();lfo.frequency.value=14;lg.gain.value=amp*.5;lfo.connect(lg).connect(g.gain);
 g.gain.linearRampToValueAtTime(amp*.5,t+dur*.2);g.gain.linearRampToValueAtTime(0,t+dur);
 s.connect(fl).connect(g).connect(out);s.start(t,Math.random());s.stop(t+dur+.02);lfo.start(t);lfo.stop(t+dur+.02);
}

/* ---------- coração ---------- */
function tocarCoracao(a,out,s,t0,total){
 const fc=Math.min(150,Math.max(45,s.fc||80)),T=60/fc,sis=Math.min(.34,.36*T+.04);
 for(let c=t0+.15;c<t0+total-T*.2;c+=T){
  const dia=T-sis;
  if(s.pulso){batida(a,out,c+.08,s.tiro?140:45,s.tiro?.05:.09,s.tiro?.9:.35);continue;}
  if(s.b4)batida(a,out,c-.09,32,.08,.5);
  batida(a,out,c,52,.1,s.b1);
  if(s.clique)estalo(a,out,c+.065,2600,.018,.35);
  batida(a,out,c+sis,72,.075,s.b2);
  if(s.estalido)estalo(a,out,c+sis+.08,2200,.02,.4);
  if(s.b3)batida(a,out,c+sis+.15,34,.09,.65);
  (s.sopros||[]).forEach(p=>{
   const k=.06*p.i;
   if(p.t==='ejetivo')ruido(a,out,c+.075,sis-.1,{f:320,q:.9},[[0,0],[.5,1],[1,0]],k);
   if(p.t==='meso')ruido(a,out,c+.1,sis*.45,{f:280,q:1.4},[[0,0],[.5,1],[1,0]],k*.8);
   if(p.t==='holo')ruido(a,out,c+.025,sis-.02,{f:620,q:1.1},[[0,.8],[.1,1],[.9,1],[1,0]],k);
   if(p.t==='diastAsp')ruido(a,out,c+sis+.015,dia*.55,{tipo:'highpass',f:700,q:.6},[[0,1],[1,0]],k*.9);
   if(p.t==='ruflar'){ruido(a,out,c+sis+.12,dia*.45,{f:90,q:2.5},[[0,.9],[1,.2]],k*1.6);
    if(p.pres)ruido(a,out,c+T-.16,.15,{f:100,q:2.5},[[0,.2],[1,1]],k*1.8);}
  });
  if(s.atrito)[[c+sis*.45,.08],[c+sis+.1,.07],[c+T-.12,.07]].forEach(([x,d])=>ruido(a,out,x,d,{f:1400,q:.6},[[0,0],[.2,1],[.6,.5],[1,0]],.07));
 }
}

/* ---------- pulmão ---------- */
function tocarPulmao(a,out,s,t0,total){
 const ins=1.1,exp=s.expProl?2.4:1.4,ciclo=ins+exp+.3;
 for(let c=t0+.1;c+ins<t0+total;c+=ciclo){
  const fim=c+ins;
  if(s.mv>0&&!s.tubario)ruido(a,out,c,ins,{f:260,q:.6},[[0,0],[.8,1],[1,0]],.13*s.mv);
  if(s.mv>0&&!s.tubario)ruido(a,out,fim,exp*.35,{f:240,q:.6},[[0,.6],[1,0]],.05*s.mv);
  if(s.tubario||s.anforico){const fl=s.anforico?{f:500,q:.8,f2:380,q2:10}:{f:950,q:.7};
   const v=s.anforico?.22:.05;ruido(a,out,c,ins,fl,[[0,0],[.3,.8],[.9,.9],[1,0]],v);ruido(a,out,fim+.05,exp*.8,fl,[[0,0],[.2,1],[1,0]],v*1.2);}
  if(s.sib)[460,610,770].forEach((f,i)=>tom(a,out,fim+.05+i*.04,exp*.85,f,.022));
  if(s.ronco){tom(a,out,fim+.05,exp*.8,118,.05,'sawtooth');tom(a,out,c+.2,ins*.6,105,.025,'sawtooth');}
  if(s.finos)for(let i=0;i<9;i++)estalo(a,out,c+ins*(.55+i*.045),1900,.009,.1);
  if(s.grossos){for(let i=0;i<6;i++)estalo(a,out,c+ins*(.1+i*.11),420,.03,.12);for(let i=0;i<4;i++)estalo(a,out,fim+.1+i*.18,380,.03,.1);}
  if(s.atrito)[c+.3,c+.6,c+.85,fim+.25,fim+.55].forEach(x=>ruido(a,out,x,.12,{f:700,q:.8},[[0,0],[.2,1],[.5,.4],[.7,.9],[1,0]],.09));
 }
 if(s.mv===0&&!s.tubario)ruido(a,out,t0,total,{f:200,q:.5},[[0,.2],[1,.2]],.01);
}

/* ---------- abdome ---------- */
function tocarAbdome(a,out,s,t0,total){
 const r=s.rha;
 ruido(a,out,t0,total,{f:200,q:.5},[[0,.2],[1,.2]],.01);
 const n={normal:2,diminuido:1,aumentado:7,metalico:6,borbor:3,ausente:0}[r]||0;
 for(let i=0;i<n;i++){const t=t0+.3+(total-1)*(i+Math.random()*.6)/Math.max(1,n);
  borbulho(a,out,t,r==='borbor'?1.2:.5+Math.random()*.4,r==='diminuido'?.05:.14,r==='metalico');
  if(r==='metalico')tom(a,out,t+.2,.25,1700+Math.random()*500,.03);}
}

/* ---------- tocar ---------- */
function tocarSom(s){
 const a=somCtx();if(!a||!s)return false;
 if(SOM.saida){const g=SOM.saida;g.gain.setTargetAtTime(0,a.currentTime,.03);setTimeout(()=>g.disconnect(),300);}
 // limitador: nenhum som passa do volume seguro do fone
 const lim=a.createDynamicsCompressor();lim.threshold.value=-8;lim.knee.value=6;lim.ratio.value=12;lim.attack.value=.003;lim.release.value=.1;
 if(!SOM.curva){SOM.curva=new Float32Array(1024);for(let i=0;i<1024;i++){const x=i/511.5-1;SOM.curva[i]=.9*Math.tanh(1.5*x)/Math.tanh(1.5);}}
 const teto=a.createWaveShaper();teto.curve=SOM.curva;lim.connect(teto).connect(a.destination);
 const out=a.createGain();out.gain.value=s.tipo==='cor'||s.tipo==='perc'?.9:s.tipo==='pulm'?6:5;out.connect(lim);SOM.saida=out;
 const t0=a.currentTime+.05,total=s.tipo==='pulm'?6.5:6;
 if(s.tipo==='cor')tocarCoracao(a,out,s,t0,total);
 if(s.tipo==='pulm')tocarPulmao(a,out,s,t0,total);
 if(s.tipo==='abd')tocarAbdome(a,out,s,t0,total);
 if(s.tipo==='perc')tocarPercussao(a,out,s,t0);
 return true;
}

/* ---------- do texto ao som ---------- */
function somCoracao(t,fc){
 const s={tipo:'cor',fc,b1:1,b2:.85,sopros:[]};
 if(/b1 forte|b1 hiperfon/.test(t))s.b1=1.6;
 if(/b1 abafada|b1 hipofon/.test(t))s.b1=.4;
 if(/b2 quase inaudível|b2 apagada/.test(t))s.b2=.15;
 if(/b2 forte|b2 mais forte|b2 hiperfon/.test(t))s.b2=1.4;
 if(/clique/.test(t))s.clique=1;
 if(/estalido/.test(t))s.estalido=1;
 if(/\bb3\b|tum-ta-tu|terceiro som|galope|grave logo depois de b2/.test(t))s.b3=1;
 if(/som grave logo antes de b1/.test(t))s.b4=1;
 if(/áspero|couro novo|neve/.test(t))s.atrito=1;
 const m=t.match(/(\d)\+\/6/),i=m?+m[1]:/discret|suave|fraco|transmitido/.test(t)?2:3;
 if(/sopro/.test(t)&&!/sem sopro/.test(t)||/ruflar/.test(t)){
  if(/ruflar/.test(t))s.sopros.push({t:'ruflar',i:/bem audível/.test(t)?4:i,pres:/reforç|antes de b1|pré-sistólico/.test(t)});
  if(/sopro diastólico|diastólico aspirativo/.test(t))s.sopros.push({t:'diastAsp',i});
  if(/holossistólico|platô/.test(t))s.sopros.push({t:'holo',i});
  else if(/sopro sistólico/.test(t)){
   const curto=/meio da sístole|curto/.test(t)&&!/crescendo/.test(t);
   s.sopros.push({t:curto?'meso':'ejetivo',i:/sopro sistólico suave/.test(t)&&/diastólico/.test(t)?2:i});
  }
 }
 return s;
}
function somDoAchado(texto,zona,c){
 const t=(texto||'').toLowerCase(),fc=+(((c&&c.vitals)||'').match(/FC (\d+)/)||[])[1]||80;
 if(/^manobra:/.test(zona)){ // só quando a manobra descreve o que se ouve
  const s=somCoracao(t,fc);
  return s.sopros.length||s.b3||s.atrito?s:null;
 }
 if(FOCOS.includes(zona)||zona==='coracao')return somCoracao(t,fc);
 if(PULSOS.includes(zona)){
  if(/tiro de pistola/.test(t))return {tipo:'cor',fc,pulso:1,tiro:1};
  if(/sopro/.test(t)&&!/sem sopro/.test(t))return {tipo:'cor',fc,b1:.2,b2:.2,sopros:[{t:'ejetivo',i:2}]};
  return {tipo:'cor',fc,pulso:1};
 }
 if(/^(apice|medio|base)[DE]$/.test(zona))return {tipo:'pulm',
  mv:/abolid/.test(t)?0:/diminuíd/.test(t)?.45:1,
  sib:/sibil/.test(t),ronco:/ronco/.test(t),finos:/estertores finos|crepitantes/.test(t),grossos:/grossos|bolhos/.test(t),
  tubario:/sopro tubárico|respiração brônquica|timbre oco/.test(t),anforico:/timbre oco|gargalo|anfóric/.test(t),
  atrito:/atrito|couro novo|áspero/.test(t),expProl:/expiração prolongada/.test(t)};
 if(REGIOES.includes(zona)||zona==='abdome'){
  const rha=/nenhum ruído|silêncio|ausentes/.test(t)?'ausente':/metálic|em salvas/.test(t)?'metalico':/já tinha sido palpado/.test(t)?'aumentado':
   /aumentad/.test(t)?(/borborigmo/.test(t)?'borbor':'aumentado'):/diminuíd/.test(t)?'diminuido':'normal';
  return {tipo:'abd',rha};
 }
 return null;
}

/* ---------- percussão ---------- */
// cada tipo de som: frequência do "corpo", duração da ressonância, volume e quanto de ruído (menos ruído = mais musical)
const PERC={
 claro:{f:120,d:.28,amp:.7,nz:.3},
 hipersonoro:{f:92,d:.45,amp:.9,nz:.3},
 timp:{f:215,d:.32,amp:.7,nz:.12,harm:1},
 hipertimp:{f:235,d:.5,amp:.95,nz:.12,harm:1},
 submacico:{f:160,d:.09,amp:.45,nz:.35},
 macico:{f:210,d:.04,amp:.32,nz:.4}
};
function batidaPercussao(a,out,t,tipo){
 const p=PERC[tipo];
 estalo(a,out,t,2600,.006,.25); // o dedo batendo
 const o=a.createOscillator(),g=a.createGain();
 o.frequency.setValueAtTime(p.f*1.08,t);o.frequency.exponentialRampToValueAtTime(p.f,t+.03);
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(p.amp,t+.004);g.gain.exponentialRampToValueAtTime(0.0001,t+p.d);
 o.connect(g).connect(out);o.start(t);o.stop(t+p.d+.02);
 if(p.harm){const o2=a.createOscillator(),g2=a.createGain();o2.frequency.value=p.f*2.02;
  g2.gain.setValueAtTime(0.0001,t);g2.gain.exponentialRampToValueAtTime(p.amp*.35,t+.004);g2.gain.exponentialRampToValueAtTime(0.0001,t+p.d*.7);
  o2.connect(g2).connect(out);o2.start(t);o2.stop(t+p.d+.02);}
 ruido(a,out,t,p.d*.8,{f:p.f*2,q:2},[[0,1],[1,0]],p.nz*p.amp);
}
function tocarPercussao(a,out,s,t0){
 s.seq.forEach((tipo,i)=>batidaPercussao(a,out,t0+.15+i*.55,tipo));
}
const tipoPercussao=t=>/hipertimpân/.test(t)?'hipertimp':/hipersonor/.test(t)?'hipersonoro':/timpân|timpanismo/.test(t)?'timp':
 /submaciç/.test(t)?'submacico':/maciç|macicez/.test(t)?'macico':/claro pulmonar/.test(t)?'claro':null;
// percussão de uma região, ou de uma manobra de percussão (que pode tocar uma sequência)
function somPercussao(texto,zona){
 const t=(texto||'').toLowerCase();
 if(zona==='manobra:skoda')return {tipo:'perc',seq:/macicez na periferia/.test(t)?['timp','timp','macico','macico']:['timp','timp','timp','timp']};
 if(zona==='manobra:macicezmovel')return {tipo:'perc',seq:/muda de lugar/.test(t)?['macico','macico','timp','timp']:['macico','macico','macico','macico']};
 if(zona==='manobra:hepatimetria'){const atrof=/5 cm/.test(t);return {tipo:'perc',seq:atrof?['claro','claro','claro','macico','timp']:['claro','claro','macico','macico','macico','timp']};}
 if(/^manobra:/.test(zona)&&!['manobra:traube','manobra:jobert'].includes(zona))return null;
 if(LOMBAR.includes(zona)||FOCOS.includes(zona)||PULSOS.includes(zona))return null;
 const tipo=tipoPercussao(t);
 return tipo?{tipo:'perc',seq:[tipo,tipo,tipo]}:null;
}

// Confere e arruma o que a IA mandou. Devolve {caso, graves, avisos}. Com algum problema grave o caso não entra.
function iaValidar(bruto,fonte){
 const graves=[],avisos=[];
 const limpa=v=>typeof v==='string'?v.replace(/<(?=[A-Za-z\/!?])/g,'‹').trim():Array.isArray(v)?v.map(limpa):v&&typeof v==='object'?Object.fromEntries(Object.entries(v).map(([k,x])=>[k,limpa(x)])):v;
 const r=limpa(bruto||{}),txt=v=>typeof v==='string'&&v.length>0;
 const num=v=>{const n=typeof v==='string'?parseFloat(v.replace(',','.')):v;return typeof n==='number'&&isFinite(n)&&n>0?n:null;};
 const ids=lista=>new Set(lista.map(x=>x.id));
 const qIds=ids(QUESTIONS),exIds=ids(EXAMS),flIds=ids(FLUID_TESTS),dxIds=ids(DX);

 const grupos=(lista,valido,nome)=>{const out=(Array.isArray(lista)?lista:[]).map(g=>({ids:(Array.isArray(g&&g.ids)?g.ids:[]).map(String).filter(valido),l:txt(g&&g.l)?g.l:''})).filter(g=>g.ids.length&&g.l);
  if(!out.length)graves.push('nenhum item que vale ponto em '+nome);return out;};
 const so=(obj,valido)=>Object.fromEntries(Object.entries(obj&&typeof obj==='object'?obj:{}).filter(([k,v])=>valido(k)&&txt(v)));

 const c={id:'ia-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),n:'IA',ia:true,modulo:'Feitos pela IA',correctSind:'derrame',sindWhy:'Macicez, frêmito e murmúrio abolidos onde há líquido: síndrome de derrame pleural.',fonte:txt(fonte)?limpa(fonte).slice(0,120):'material do aluno'};
 ['title','card','pname','briefing','vitals','geral','fluidLook','dxWhy'].forEach(k=>{if(txt(r[k]))c[k]=r[k];else graves.push('faltou '+k);});
 c.look=IA_LOOKS[r.look]?r.look:'carlos';
 c.answers={};QUESTIONS.forEach(q=>{const a=r.answers&&r.answers[q.id];if(txt(a))c.answers[q.id]=a;else{c.answers[q.id]='Não sei dizer, doutor.';avisos.push('sem resposta para '+q.id);}});
 c.keyQ=grupos(r.keyQ,id=>qIds.has(id),'anamnese');
 c.effSides=(Array.isArray(r.effSides)?r.effSides:[]).filter(s=>s==='D'||s==='E');c.effSides=[...new Set(c.effSides)];
 if(!c.effSides.length)graves.push('não disse o lado do derrame');
 c.exam=so(r.exam,manobra);
 c.keyExam=grupos(r.keyExam,manobra,'exame físico');
 c.res=so(r.res,id=>exIds.has(id)&&id!=='sprot'&&id!=='sdhl');
 c.keyEx=grupos(r.keyEx,id=>exIds.has(id),'exames');
 const chave=c.keyEx.flatMap(g=>g.ids);
 c.neutral=[...new Set((Array.isArray(r.neutral)?r.neutral:[]).map(String))].filter(id=>exIds.has(id)&&!chave.includes(id));
 const rx=r.rx&&typeof r.rx==='object'?r.rx:{},eff={};
 c.effSides.forEach(s=>{const v=num(rx.eff&&rx.eff[s]);eff[s]=v?Math.min(.5,Math.max(.1,v)):.35;});
 c.rx={eff};if(rx.cardio)c.rx.cardio=1;if(rx.consol==='D'||rx.consol==='E')c.rx.consol=rx.consol;
 const tap=r.tap&&typeof r.tap==='object'?r.tap:{};
 c.tap={sides:(Array.isArray(tap.sides)?tap.sides:[]).filter(s=>c.effSides.includes(s)),spaces:[...new Set((Array.isArray(tap.spaces)?tap.spaces:[]).map(Number))].filter(n=>Number.isInteger(n)&&n>=1&&n<=8).sort((a,b)=>a-b)};
 if(!c.tap.sides.length)c.tap.sides=c.effSides.slice();
 if(!c.tap.spaces.length){c.tap.spaces=[6,7,8];avisos.push('espaços da punção ajustados');}
 c.fluidColor=/^#[0-9a-fA-F]{6}$/.test(r.fluidColor||'')?r.fluidColor:'#e8cd5e';
 const L=r.light&&typeof r.light==='object'?r.light:{};
 c.light={};['protL','protS','ldhL','ldhS','albL','albS'].forEach(k=>{const v=num(L[k]);if(v)c.light[k]=v;else graves.push('faltou o valor '+k+' de Light');});
 c.fluid=so(r.fluid,id=>flIds.has(id));
 if(Object.keys(c.light).length===6){ // o texto do líquido precisa bater com os números de Light
  c.fluid.prot='Proteínas totais '+nf(c.light.protL)+' g/dL';c.fluid.dhl='DHL '+c.light.ldhL+' UI/L';c.fluid.alb='Albumina '+nf(c.light.albL)+' g/dL';}
 c.keyFluid=grupos(r.keyFluid,id=>flIds.has(id),'análise do líquido');
 if(r.diuretico===true)c.diuretico=true;
 c.correctClass=r.correctClass==='transudato'?'transudato':r.correctClass==='exsudato'?'exsudato':null;
 if(!c.correctClass)graves.push('não disse se é transudato ou exsudato');
 else if(Object.keys(c.light).length===6&&iaClasse(c.light,c.diuretico)!==c.correctClass)graves.push(`os números de Light dão ${iaClasse(c.light,c.diuretico)}, mas o caso diz ${c.correctClass}`);

 c.correctDx=dxIds.has(r.correctDx)?r.correctDx:null;if(!c.correctDx)graves.push('diagnóstico fora da lista do jogo');
 c.conduta=(Array.isArray(r.conduta)?r.conduta:[]).filter(x=>x&&txt(x.t)&&txt(x.why)).slice(0,10).map((x,i)=>({id:'c'+(i+1),t:x.t,ok:x.ok===true||x.ok===1?1:0,why:x.why}));
 if(!c.conduta.some(x=>x.ok))graves.push('nenhuma conduta certa');

 c.teaching=(Array.isArray(r.teaching)?r.teaching:[]).filter(x=>x&&txt(x.t)&&txt(x.p)).slice(0,6);
 if(!c.teaching.length)graves.push('faltaram os pontos para levar');
 return {caso:c,graves,avisos};

function iaPrompt(material,feitos,temFotos){
 const exemplo=Object.assign({},CASES.find(c=>c.id==='tb')||CASES[0]);
 ['id','n','ia','fonte','modulo','correctSind','sindWhy'].forEach(k=>delete exemplo[k]);
 return `Você é um professor de medicina que escreve casos clínicos para um jogo de estudo. O aluno é o médico de plantão: conversa com o paciente, examina, pede exames, faz toracocentese e decide classificação, diagnóstico e conduta.

REGRAS
1. Conteúdo médico só do material: critérios, valores de corte, achados e condutas precisam estar no material. Não invente o que o material não diz. O "dxWhy", a "conduta" e o "teaching" devem citar os critérios do material.
2. Se o material não tratar de derrame pleural, responda só {"erro":"explique em uma frase"}.
3. Paciente fictício: nome e história inventados, brasileiro, linguagem leiga nas respostas, em português do Brasil.
4. Nada mastigado: o briefing, as respostas e os resultados não dizem o que é importante nem chamam valor de alterado. Resultados crus, com unidade e referência quando fizer sentido.
5. Coerência dos números: os 6 valores de "light" (proteína e DHL do líquido e do soro, albumina do líquido e do soro) precisam levar à "correctClass" pelos critérios de Light (proteína líquido/soro > 0,5; DHL líquido/soro > 0,6; DHL do líquido > 2/3 do limite superior do soro, que no jogo é 200, ou seja > 133). Se o paciente usa diurético ("diuretico": true), gradiente de proteína soro−líquido > 3,1 g/dL ou de albumina > 1,2 g/dL torna transudato.
6. Use SÓ os ids das listas abaixo. Responda TODAS as perguntas.
7. Escolha um diagnóstico diferente destes já criados: ${feitos.length?feitos.join(', '):'(nenhum ainda)'}. Varie idade, sexo e lado do derrame.

FORMATO: responda só com um objeto JSON no mesmo formato deste caso de exemplo (é só o molde, não copie o conteúdo):

MATERIAL DO ALUNO
"""

function tapHtml(c){
 let h='';
  if(G.tapped){
   h+=`<div class="okmsg">Líquido colhido: ${c.fluidLook}</div>${syringe()}${fluidForm()}`;
  }else{
   const t=G.tap;
   let ribs='',sp='';
   for(let i=0;i<10;i++){const y=34+i*24;
    ribs+=`<path d="M138 ${y} Q90 ${y-8} 52 ${y+16}" stroke="#a9855f" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M162 ${y} Q210 ${y-8} 248 ${y+16}" stroke="#a9855f" stroke-width="7" fill="none" stroke-linecap="round"/>`;}
   for(let i=1;i<=9;i++){const y=34+(i-1)*24+6;
    ['E','D'].forEach(s=>{const x=s==='E'?56:162;sp+=`<rect class="space ${t.space&&t.space.s===s&&t.space.i===i?'sel':''}" data-m="space" data-s="${s}" data-i="${i}" x="${x}" y="${y}" width="82" height="16" rx="4"><title>${i}º espaço visível, lado ${s}</title></rect>`;});}
   h+=`<p class="muted" style="font-size:.9rem">Paciente sentado, inclinado para a frente. Você está atrás dele. Escolha o espaço intercostal, a posição da agulha e o volume.</p>
   <div class="tapwrap" style="margin-top:10px">
    <svg viewBox="0 0 300 280"><rect x="40" y="10" width="220" height="262" rx="40" fill="#d8b896"/>
     <path d="M70 40 L120 46 L112 190 Z" fill="#cfa983" opacity=".8"/><path d="M230 40 L180 46 L188 190 Z" fill="#cfa983" opacity=".8"/>
     ${ribs}<rect x="144" y="14" width="12" height="258" rx="4" fill="#b08a64"/>${sp}
     <text x="48" y="28" font-size="13" font-family="monospace" fill="#5a3d24">E</text><text x="242" y="28" font-size="13" font-family="monospace" fill="#5a3d24">D</text></svg>
    <div>
     <b>Espaço escolhido:</b> <span class="mono">${t.space?t.space.i+'º espaço, lado '+(t.space.s==='D'?'direito':'esquerdo'):'nenhum'}</span>
     <div class="opts">
      ${[['sup','Rente à borda superior da costela de baixo'],['meio','No meio do espaço intercostal'],['inf','Rente à borda inferior da costela de cima']].map(o=>`<label><input type="radio" name="pos" data-m="tpos" value="${o[0]}" ${t.pos===o[0]?'checked':''}>${o[1]}</label>`).join('')}
     </div>
     <div class="opts">
      ${[['60','Diagnóstica: cerca de 60 mL'],['1000','Alívio: cerca de 1.000 mL'],['2000','Esvaziar: cerca de 2.000 mL']].map(o=>`<label><input type="radio" name="vol" data-m="tvol" value="${o[0]}" ${t.vol===o[0]?'checked':''}>${o[1]}</label>`).join('')}
     </div>
     <div class="row"><button class="btn" data-m="punct" ${t.space&&t.pos&&t.vol?'':'disabled'}>Puncionar (20 min)</button></div>
    </div></div>`;
  }
  if(G.tap.msg)h+=G.tap.msg;
  return h;
}
const FIGS=[['costas','Costas'],['frente','Frente'],['cor','Coração'],['abd','Abdome'],['man','Manobras'],['tap','Toracocentese'],['log','Achados']];
const logItem=(e,i)=>`<div><b>${e.k}</b>${e.v}${e.som?`<button class="ouvir" data-m="som" data-i="${i}">▶ Ouvir</button>`:''}</div>`;
function syringe(){const col=G.c.fluidColor;return `<svg viewBox="0 0 240 50" style="width:100%;max-width:300px;margin-top:10px"><rect x="20" y="14" width="160" height="22" rx="4" fill="#e9f1f4" stroke="#9fb2bc"/><rect x="24" y="17" width="120" height="16" fill="${col}"/><rect x="180" y="21" width="44" height="8" fill="#9fb2bc"/><rect x="4" y="10" width="18" height="30" rx="3" fill="#6a7c86"/></svg>`;}
function fluidForm(){
 const left=FLUID_TESTS.filter(f=>G.fluid[f.id]===undefined);
 if(!left.length)return '<p class="muted" style="margin-top:10px">Todas as análises possíveis já foram pedidas.</p>';
 return `<h3 class="sec">O que mandar para o laboratório?</h3><div class="list">${left.map(f=>`<label class="check"><input type="checkbox" data-fl="${f.id}">${f.t}</label>`).join('')}</div>
 <div class="row"><button class="btn" data-m="sendfl">Enviar amostra (resultado em 40 min)</button></div>`;
}

function mPc(m){
 const tab=m.tab||'order';
 let h=tabs([['order','Pedir exames'],['res','Resultados'],['fluid','Líquido pleural']],tab);
 if(tab==='order'){
  const left=EXAMS.filter(e=>G.orders[e.id]===undefined);
  h+=`<p class="muted" style="font-size:.9rem">Exames pedidos sem necessidade custam pontos. O tempo indica quando o resultado chega.</p>
  <div class="list" style="margin-top:8px">${left.map(e=>`<label class="check"><input type="checkbox" data-ex="${e.id}">${e.t}<span class="tm">${e.d} min</span></label>`).join('')||'<p class="muted">Tudo já foi pedido.</p>'}</div>
  <div class="row"><button class="btn" data-m="order">Solicitar</button></div>`;
 }
 if(tab==='res'){
  const ids=Object.keys(G.orders);
  h+=ids.length?`<div class="list">${ids.map(id=>{const r=ready(id);if(r&&id!=='rx')G.seen[id]=1;return `<div class="res ${r?'':'wait'}"><b>${exName(id)}</b><span class="v">${r?examResult(id):'Aguardando · pronto às '+fmtT(G.orders[id])}</span></div>`;}).join('')}</div>`:'<p class="muted">Nenhum exame pedido ainda.</p>';
 }
 if(tab==='fluid'){
  if(!G.tapped)h+='<p class="muted">Nenhuma amostra de líquido pleural colhida ainda.</p>';
  else{
   const ids=Object.keys(G.fluid);
   h+=`<div class="list">${ids.map(id=>{const r=fready(id);if(r)G.seen['f_'+id]=1;return `<div class="res ${r?'':'wait'}"><b>${flName(id)}</b><span class="v">${r?fluidResult(id):'Aguardando · pronto às '+fmtT(G.fluid[id])}</span></div>`;}).join('')}</div>`;
   h+=`<p class="muted" style="margin-top:10px;font-size:.9rem">O laboratório guardou a amostra. Dá para pedir mais análises.</p>`+fluidForm();
  }
 }
 return ['Computador do plantão',h];
}

}

 <h3 class="sec">Síndrome principal</h3><div class="opts">${SINDROMES.map(d=>`<label><input type="radio" name="sind" data-m="fsind" value="${d.id}" ${f.sind===d.id?'checked':''}>${d.t}</label>`).join('')}</div>

modal.addEventListener('click',e=>{
 const el=e.target.closest('[data-m]');if(!el||el.disabled)return;
 const a=el.dataset.m,m=G.modal,c=G.c;
 if(a==='close'){closeM();return;}

  percutir:z==='hcd'?'Som maciço.':'Som timpânico.',auscultar:'Ruídos hidroaéreos presentes e normoaudíveis.'}[tool];
 if(LOMBAR.includes(z))return {inspecionar:'Sem alterações.',palpar:'Rim não palpável, indolor.',percutir:'Punho-percussão sem dor.',auscultar:'Não se aplica.'}[tool];
 if(tool==='manobra'){const ab={murphy:'Inspiração completa, sem dor.',blumberg:'Descompressão sem dor.',rovsing:'Sem dor na fossa ilíaca direita.',psoas:'Sem dor.',obturador:'Sem dor.',

 if(tool==='manobra')return {ortostase:'Deitado e depois de 3 minutos em pé: PA e frequência praticamente iguais, sem sintomas.',
  pa3:'Depois de 5 minutos de repouso, três medidas nos dois braços: valores iguais aos dos sinais vitais. Diferença entre os braços menor que 15 mmHg.'}[z]||'Nenhuma mudança na ausculta.';

 if(/^(apice|medio|base)[DE]$/.test(z)){

   auscultar:eff?'Murmúrio vesicular abolido. Ressonância vocal diminuída.':'Murmúrio vesicular presente, sem ruídos adventícios. Ressonância vocal normal.'}[tool];
 }
 const D={

function score(){
 const c=G.c,f=G.final;
 const hit=(groups,arr)=>groups.filter(g=>g.ids.some(id=>arr.includes(id)));
 const qH=hit(c.keyQ,G.asked),eH=hit(c.keyExam,G.examined),xH=hit(c.keyEx,Object.keys(G.orders)),fH=hit(c.keyFluid||[],Object.keys(G.fluid));
 const keyIds=c.keyEx.flatMap(g=>g.ids);
 const extra=Object.keys(G.orders).filter(id=>!keyIds.includes(id)&&!c.neutral.includes(id));
 const pen=G.tapEv.reduce((s,e)=>s+e.p,0);
 const okT=c.conduta.filter(x=>x.ok).length,okH=c.conduta.filter(x=>x.ok&&f.cond.includes(x.id)).length,wr=c.conduta.filter(x=>!x.ok&&f.cond.includes(x.id)).length;
 const P=pesos(c),s={
  q:Math.round(P.q*qH.length/c.keyQ.length),
  ex:Math.round(P.ex*eH.length/c.keyExam.length),
  lab:Math.max(0,Math.round(P.lab*(c.keyEx.length?xH.length/c.keyEx.length:1))-2*extra.length), // sem exame-chave: nota cheia se não pedir nada à toa
  sind:sindOk(c,f.sind)?P.sind:0,
  dx:f.dx===c.correctDx?P.dx:0,
  cond:Math.max(0,Math.round(P.cond*okH/okT)-4*wr)
 };
 if(ehPleural(c)){
  s.proc=G.tapped?Math.max(0,P.proc-pen):0;
  s.fl=Math.round(P.fl*fH.length/c.keyFluid.length);
  s.cls=f.cls===c.correctClass?P.cls:0;
 }
 s.total=Object.values(s).reduce((a,b)=>a+b,0);
 if(!ehPleural(c)){s.pen=pen;s.total=Math.max(0,s.total-pen);} // punção onde não há líquido também custa
 s.miss={q:c.keyQ.filter(g=>!qH.includes(g)),ex:c.keyExam.filter(g=>!eH.includes(g)),lab:c.keyEx.filter(g=>!xH.includes(g)),fl:ehPleural(c)?c.keyFluid.filter(g=>!fH.includes(g)):[]};
 s.extra=extra;return s;
}
function lightText(){

 return `Proteína ${nf(L.protL)}/${nf(L.protS)} = ${nf(rp.toFixed(2))} (${rp>.5?'> 0,5':'≤ 0,5'}) · DHL ${L.ldhL}/${L.ldhS} = ${nf(rl.toFixed(2))} (${rl>.6?'> 0,6':'≤ 0,6'}) · DHL do líquido ${L.ldhL} ${L.ldhL>133?'>':'≤'} 133 (2/3 de 200).`;
}

  if(!G.modal){
   if(G.keys.u)vy-=1;if(G.keys.d)vy+=1;if(G.keys.l)vx-=1;if(G.keys.r)vx+=1;
   if(!vx&&!vy&&G.target){const dx=G.target.x-G.pos.x,dy=G.target.y-G.pos.y,dist=Math.hypot(dx,dy);
    if(dist<3){const p=G.pending;G.target=null;if(p){interact(p);}}else{vx=dx/dist;vy=dy/dist;}}
  }
  const mv=vx||vy;
  if(mv){const n=Math.hypot(vx,vy)||1,sp=78*dt;const nx=G.pos.x+vx/n*sp,ny=G.pos.y+vy/n*sp;let moved=false;
   if(!blocked(nx,G.pos.y)){G.pos.x=nx;moved=true;}if(!blocked(G.pos.x,ny)){G.pos.y=ny;moved=true;}
   if(Math.abs(vx)>Math.abs(vy))G.dir=vx<0?'left':'right';else G.dir=vy<0?'up':'down';
   if(!moved&&G.target){G.stuck=(G.stuck||0)+dt;if(G.stuck>.4){G.target=null;G.pending=null;}}}
  G.moving=!!mv;
  let near=null,best=30;Object.values(OBJ).forEach(o=>{const d=Math.hypot(o.ip.x-G.pos.x,o.ip.y-G.pos.y);if(d<best){best=d;near=o;}});
  G.near=near;
  const ab=$('#actBtn');if(near&&!G.modal){ab.hidden=false;ab.textContent=near.lbl();}else ab.hidden=true;
  ctx.imageSmoothingEnabled=false;
  drawRoom(t);
  const ents=[{y:G.pos.y,d:()=>drawPerson(G.pos.x,G.pos.y,LOOKS.doctor,t,G.moving,G.dir)},{y:238,d:()=>drawPerson(176,238,LOOKS.nurse,t,false,'up')}].sort((a,b)=>a.y-b.y);
  ents.forEach(e=>e.d());
  const unseenLab=Object.keys(G.orders).some(id=>id!=='rx'&&ready(id)&&!G.seen[id])||Object.keys(G.fluid).some(id=>fready(id)&&!G.seen['f_'+id]);
  if(unseenLab)drawBang(363,40,t);
  if(ready('rx')&&!G.seen.rx)drawBang(252,10+12,t);
  if(near&&!G.modal)drawPrompt(near);
 }
 requestAnimationFrame(loop);
}
renderHome();requestAnimationFrame(loop);
