<title>Plantão Pleural</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#0e171d;--panel:#15232c;--panel2:#1c2e39;--line:#2b4250;--ink:#e6eff2;--muted:#94aab3;
  --accent:#5ad1c3;--accent-ink:#06211e;--warn:#f2b45a;--bad:#ef7d6d;--good:#7fd99a;
  --f-pixel:'Pixelify Sans','Courier New',monospace;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-body);margin:0;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto}
h1,h2,h3{font-family:var(--f-pixel);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 16px;font-weight:600;min-height:42px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 10px;min-height:34px;font-size:.85rem}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}

/* home */
.hero{display:grid;gap:14px;padding:18px 0 6px}
.hero h1{font-size:clamp(2.2rem,7vw,3.6rem);color:var(--accent);letter-spacing:.02em}
.hero p{max-width:58ch;color:var(--muted);font-size:1.02rem}
.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:22px}
.ccard{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:14px;text-align:left;display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:start;transition:border-color .15s,transform .15s}
.ccard:hover{border-color:var(--accent);transform:translateY(-2px)}
.ccard canvas{width:72px;height:72px;image-rendering:pixelated;border-radius:8px;background:var(--panel2)}
.ccard .n{font:500 .72rem var(--f-mono);color:var(--accent);letter-spacing:.08em}
.ccard h3{font-size:1.15rem;margin:2px 0 4px}
.ccard p{font-size:.88rem;color:var(--muted)}
.ccard .best{font:500 .75rem var(--f-mono);color:var(--warn);margin-top:6px;display:block}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:22px}
.how div{background:var(--panel);border-radius:10px;padding:12px 14px;font-size:.9rem;color:var(--muted)}
.how b{display:block;color:var(--ink);font-family:var(--f-pixel);font-size:1.05rem;margin-bottom:2px}
.foot{margin-top:26px;font-size:.8rem;color:var(--muted);max-width:72ch}

/* game */
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.hud .who{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.hud .who b{font-family:var(--f-pixel);font-size:1.15rem}
.clock{font:500 1rem var(--f-mono);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 10px;color:var(--warn)}
.hud .tools{display:flex;gap:6px;flex-wrap:wrap}
.stage{position:relative;border:3px solid var(--line);border-radius:10px;overflow:hidden;background:#000;max-width:100%}
#cv{display:block;width:100%;height:auto;image-rendering:pixelated;touch-action:manipulation;cursor:pointer}
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:grid;gap:6px;pointer-events:none;width:max-content;max-width:90%}
#toast div{background:rgba(10,20,26,.92);border:1px solid var(--accent);color:var(--ink);padding:6px 12px;border-radius:6px;font-size:.85rem;animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
#actBtn{position:absolute;right:10px;bottom:10px;background:var(--warn);color:#2a1a00;border:0;border-radius:8px;padding:8px 14px;font-family:var(--f-pixel);font-size:1rem;box-shadow:0 3px 0 #9c6a1d}
.ctrl{margin-top:10px;font-size:.85rem;color:var(--muted)}
.ctrl kbd{font-family:var(--f-mono);background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:.78rem;color:var(--ink)}

/* modal */
#modal{position:fixed;inset:0;background:rgba(3,8,11,.72);display:flex;align-items:flex-end;justify-content:center;z-index:50;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
@media(min-width:700px){#modal{align-items:center}}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:14px;width:100%;max-width:800px;max-height:100%;display:flex;flex-direction:column;box-shadow:0 20px 50px -20px #000}
.panel header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel header h2{font-size:1.3rem}
.panel .x{background:var(--panel2);border:1px solid var(--line);border-radius:8px;width:38px;height:38px;font-size:1.1rem}
.pbody{padding:14px 16px 18px;overflow-y:auto;min-height:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:.85rem}
.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.talk{display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;align-items:start}
.talk canvas{width:88px;height:88px;image-rendering:pixelated;border-radius:10px;background:var(--panel2);border:2px solid var(--line)}
.bubble{background:#f4efe2;color:#1d2328;border-radius:12px;padding:12px 14px;min-height:64px;font-size:.98rem;position:relative}
.bubble::before{content:"";position:absolute;left:-8px;top:18px;border:8px solid transparent;border-right-color:#f4efe2;border-left:0}
.bubble .nm{display:block;font:700 .9rem var(--f-pixel);color:#3c6e68;margin-bottom:2px}
.qcat{margin-top:12px}
.qcat h4{margin:0 0 6px;font:500 .7rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:.88rem;text-align:left}
.chip:hover{border-color:var(--accent)}
.chip.done{opacity:.5}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);opacity:1}
.examgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:10px}
.fig{background:var(--panel2);border-radius:10px;padding:8px;text-align:center}
.fig h4{margin:0 0 4px;font:500 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fig svg{width:100%;max-width:260px;height:auto}
.zone{fill:rgba(90,209,195,.08);stroke:rgba(90,209,195,.35);stroke-width:1;cursor:pointer;transition:fill .12s}
.zone:hover{fill:rgba(90,209,195,.3)}
.zone.hit{fill:rgba(242,180,90,.22)}
.space{fill:transparent;cursor:pointer}
.space:hover{fill:rgba(90,209,195,.25)}
.space.sel{fill:rgba(242,180,90,.55)}
.flog{margin-top:12px;display:grid;gap:6px}
.flog div{background:var(--panel2);border-left:3px solid var(--accent);border-radius:6px;padding:7px 10px;font-size:.9rem}
.flog div b{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);display:block;font-weight:500}
.list{display:grid;gap:6px}
.check{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;font-size:.92rem}
.check input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.check .tm{margin-left:auto;font:500 .75rem var(--f-mono);color:var(--muted);white-space:nowrap}
.res{background:var(--panel2);border-radius:8px;padding:9px 12px;font-size:.92rem}
.res b{display:block;font:500 .75rem var(--f-mono);color:var(--muted);font-weight:500}
.res .v{font-family:var(--f-mono)}
.res.wait .v{color:var(--muted);font-style:italic}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.note{background:rgba(242,180,90,.12);border-left:3px solid var(--warn);border-radius:6px;padding:9px 12px;font-size:.9rem;margin-top:10px}
.event{background:rgba(239,125,109,.12);border-left:3px solid var(--bad);border-radius:6px;padding:9px 12px;font-size:.92rem;margin-top:10px}
.okmsg{background:rgba(127,217,154,.12);border-left:3px solid var(--good);border-radius:6px;padding:9px 12px;font-size:.92rem;margin-top:10px}
.opts{display:grid;gap:6px;margin-top:8px}
.opts label{display:flex;gap:8px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.9rem;cursor:pointer}
.opts input{accent-color:var(--accent);margin-top:3px}
.tapwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media(max-width:640px){.tapwrap{grid-template-columns:minmax(0,1fr)}}
.tapwrap svg{width:100%;height:auto;background:#d9c2a8;border-radius:10px}
.rxbox{display:flex;justify-content:center;background:#000;border-radius:10px;padding:10px}
.rxbox canvas{width:100%;max-width:320px;height:auto}
.calc{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.calc input{flex:1 1 200px;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--ink);font:500 1rem var(--f-mono)}
.calcout{font:500 1.2rem var(--f-mono);color:var(--warn);margin-top:8px;min-height:1.6em}
h3.sec{font-size:1.05rem;margin:16px 0 8px}

/* debrief */
.deb{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:20px}
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .big{font:700 4.4rem/1 var(--f-pixel);color:var(--accent)}
.bars{display:grid;gap:8px;margin:16px 0}
.bar{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;font-size:.9rem}
@media(max-width:480px){.bar{grid-template-columns:96px 1fr 46px}}
.bar .tr{height:10px;background:var(--panel2);border-radius:5px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--accent)}
.bar .nm{font-family:var(--f-mono);text-align:right;font-size:.8rem}
.miss{display:grid;gap:6px}
.miss li{font-size:.9rem}
.cond{display:grid;gap:6px}
.cond div{background:var(--panel2);border-radius:8px;padding:9px 12px;border-left:3px solid var(--line);font-size:.92rem}
.cond .ok{border-color:var(--good)}.cond .no{border-color:var(--bad)}.cond .mi{border-color:var(--warn)}
.cond small{display:block;color:var(--muted);margin-top:2px}
.learn{display:grid;gap:10px}
.learn div{border-left:3px solid var(--accent);padding-left:12px}
.learn b{font-family:var(--f-pixel);font-size:1.02rem}
</style>

<div class="wrap">
  <section id="home"></section>
  <section id="game" hidden>
    <div class="hud">
      <div class="who"><b id="hudCase"></b><span class="clock" id="hudClock">19:00</span></div>
      <div class="tools">
        <button class="btn ghost small" data-hud="notes">Caderneta</button>
        <button class="btn ghost small" data-hud="wait">Esperar 15 min</button>
        <button class="btn ghost small" data-hud="help">Ajuda</button>
        <button class="btn ghost small" data-hud="quit">Sair</button>
      </div>
    </div>
    <div class="stage">
      <canvas id="cv" width="480" height="288" aria-label="Sala de emergência"></canvas>
      <div id="toast"></div>
      <button id="actBtn" hidden></button>
    </div>
    <p class="ctrl">Ande com <kbd>WASD</kbd> ou setas, interaja com <kbd>E</kbd>. No celular, toque no lugar ou na pessoa para ir até lá. <kbd>N</kbd> abre a caderneta.</p>
  </section>
  <section id="debrief" hidden></section>
</div>
<div id="modal" hidden><div class="panel" role="dialog" aria-modal="true"><header><h2 id="mTitle"></h2><button class="x" data-m="close" aria-label="Fechar">✕</button></header><div class="pbody" id="mBody"></div></div></div>

 const m=G.modal;if(!m)return;const st=mBody.scrollTop;
 const R={patient:mPatient,nurse:mNurse,pc:mPc,xray:mXray,close:mClose,notes:mNotes,help:mHelp}[m.kind];
 const [title,html,after]=R(m);
 $('#mTitle').textContent=title;mBody.innerHTML=html;
 if(after)after();
 mBody.scrollTop=top?0:st;
}
const tabs=(list,cur)=>`<div class="tabs">${list.map(([k,t])=>`<button class="${k===cur?'on':''}" data-m="tab" data-v="${k}">${t}</button>`).join('')}</div>`;

function mPatient(m){
 const c=G.c,tab=m.tab||'talk';
 let h=tabs([['talk','Conversar'],['exam','Examinar'],['tap','Toracocentese']],tab),after=null;
 if(tab==='talk'){
  const cats=[...new Set(QUESTIONS.map(q=>q.cat))];
  h+=`<div class="talk"><canvas id="por"></canvas><div class="bubble"><span class="nm">${c.pname}</span><span id="say"></span></div></div>`;
  h+=cats.map(cat=>`<div class="qcat"><h4>${cat}</h4><div class="chips">${QUESTIONS.filter(q=>q.cat===cat).map(q=>`<button class="chip ${G.asked.includes(q.id)?'done':''}" data-m="ask" data-v="${q.id}">${q.t}</button>`).join('')}</div></div>`).join('');
  after=()=>{drawPortrait($('#por'),c.look,'sick');
   const txt=G.lastAns?c.answers[G.lastAns]:'(olha para você, esperando a primeira pergunta)';
   const el=$('#say');if(typer)clearInterval(typer);
   if(m.typeNow&&G.lastAns){let i=0;typer=setInterval(()=>{i+=2;el.textContent=txt.slice(0,i);if(i>=txt.length)clearInterval(typer);},18);m.typeNow=false;}
   else el.textContent=txt;};

  <div class="examgrid">

    <line x1="100" y1="50" x2="100" y2="200" stroke="#b88a66" stroke-width="2"/>
    <text x="40" y="47" fill="#94aab3" font-size="11" font-family="monospace">E</text><text x="154" y="47" fill="#94aab3" font-size="11" font-family="monospace">D</text>
    ${z('apiceE',44,56,52,44)}${z('apiceD',104,56,52,44)}${z('medioE',42,104,54,44)}${z('medioD',104,104,54,44)}${z('baseE',40,152,56,44)}${z('baseD',104,152,56,44)}
   </svg></div>
   <div class="fig"><h4>Frente</h4><svg viewBox="0 0 200 220">
    <circle cx="100" cy="22" r="16" fill="#c99a76"/><rect x="88" y="36" width="24" height="12" fill="#c99a76"/>
    <path d="M52 48 Q100 40 148 48 L150 140 L50 140 Z" fill="#d8ad88"/><rect x="66" y="140" width="68" height="16" fill="#d8ad88"/>
    <rect x="70" y="156" width="26" height="60" fill="#c99a76"/><rect x="104" y="156" width="26" height="60" fill="#c99a76"/>
    ${z('pescoco',80,34,40,18)}${z('coracao',96,62,44,40)}${z('abdome',62,108,76,46)}${z('pernas',66,160,68,54)}
   </svg></div></div>
  <div class="flog">${G.examLog.slice().reverse().map(e=>`<div><b>${e.k}</b>${e.v}</div>`).join('')||'<p class="muted">Nenhum achado ainda.</p>'}</div>`;
 }
 if(tab==='tap'){

function syringe(){const col=G.c.fluidColor;return `<svg viewBox="0 0 240 50" style="width:100%;max-width:300px;margin-top:10px"><rect x="20" y="14" width="160" height="22" rx="4" fill="#e9f1f4" stroke="#9fb2bc"/><rect x="24" y="17" width="120" height="16" fill="${col}"/><rect x="180" y="21" width="44" height="8" fill="#9fb2bc"/><rect x="4" y="10" width="18" height="30" rx="3" fill="#6a7c86"/></svg>`;}
function fluidForm(){
 const left=FLUID_TESTS.filter(f=>G.fluid[f.id]===undefined);
 if(!left.length)return '<p class="muted" style="margin-top:10px">Todas as análises possíveis já foram pedidas.</p>';
 return `<h3 class="sec">O que mandar para o laboratório?</h3><div class="list">${left.map(f=>`<label class="check"><input type="checkbox" data-fl="${f.id}">${f.t}</label>`).join('')}</div>

  const left=EXAMS.filter(e=>G.orders[e.id]===undefined);

 }
 if(tab==='res'){
  const ids=Object.keys(G.orders);
  h+=ids.length?`<div class="list">${ids.map(id=>{const r=ready(id);if(r&&id!=='rx')G.seen[id]=1;return `<div class="res ${r?'':'wait'}"><b>${exName(id)}</b><span class="v">${r?examResult(id):'Aguardando · pronto às '+fmtT(G.orders[id])}</span></div>`;}).join('')}</div>`:'<p class="muted">Nenhum exame pedido ainda.</p>';
 }
 if(tab==='fluid'){

modal.addEventListener('click',e=>{
 const el=e.target.closest('[data-m]');if(!el||el.disabled)return;
 const a=el.dataset.m,m=G.modal,c=G.c;
 if(a==='close'){closeM();return;}
 if(a==='tab'){m.tab=el.dataset.v;G.tap.msg=null;renderM(true);return;}
 if(a==='ask'){const id=el.dataset.v;if(!G.asked.includes(id)){G.asked.push(id);G.talkLog.push({q:QUESTIONS.find(q=>q.id===id).t,a:c.answers[id]});}advance(2);G.lastAns=id;m.typeNow=true;renderM();return;}
 if(a==='tool'){G.tool=el.dataset.v;renderM();return;}
 if(a==='ex'){const z=el.dataset.v,tool=z==='geral'?'inspecionar':G.tool,key=tool+':'+z;
  if(!G.examined.includes(key))G.examined.push(key);
  G.examLog.push({k:(z==='geral'?'Inspeção geral':TOOLS.find(t=>t.id===tool).t+' · '+ZNAME[z]),v:findExam(tool,z)});advance(1);renderM();return;}
 if(a==='space'){G.tap.space={s:el.dataset.s,i:+el.dataset.i};G.tap.msg=null;renderM();return;}
 if(a==='tpos'){G.tap.pos=el.value;renderM();return;}
 if(a==='tvol'){G.tap.vol=el.value;renderM();return;}
 if(a==='punct'){doTap();renderM();return;}
 if(a==='sendfl'){const ids=[...mBody.querySelectorAll('[data-fl]:checked')].map(i=>i.dataset.fl);if(!ids.length){toast('Marque ao menos uma análise.');return;}
  advance(3);ids.forEach(id=>G.fluid[id]=G.clock+40);G.tap.msg=`<div class="okmsg">Amostra enviada. Resultado às ${fmtT(G.clock+40)}.</div>`;renderM();return;}
 if(a==='vitals'){G.vitals=true;if(!G.examined.includes('vitals'))G.examined.push('vitals');advance(3);G.nurseSay='Sinais vitais: '+c.vitals;renderM();return;}
 if(a==='wait15'){advance(15);G.nurseSay='Pronto, passaram 15 minutos.';renderM();return;}
 if(a==='waitnext'){const n=nextPending();if(n!==null){advance(n-G.clock);G.nurseSay='Chegou resultado, doutor. Dá uma olhada no computador.';}renderM();return;}
 if(a==='brief'){G.nurseSay=c.briefing;renderM();return;}
 if(a==='order'){const ids=[...mBody.querySelectorAll('[data-ex]:checked')].map(i=>i.dataset.ex);if(!ids.length){toast('Marque ao menos um exame.');return;}
  advance(2);ids.forEach(id=>G.orders[id]=G.clock+EXAMS.find(x=>x.id===id).d);toast(ids.length+' exame(s) solicitado(s)');renderM();return;}
 if(a==='fcls'){G.final.cls=el.value;renderM();return;}
 if(a==='fdx'){G.final.dx=el.value;renderM();return;}
 if(a==='fcond'){const v=el.value,i=G.final.cond.indexOf(v);if(el.checked&&i<0)G.final.cond.push(v);if(!el.checked&&i>=0)G.final.cond.splice(i,1);renderM();return;}
 if(a==='sign'){closeM();finish();return;}
 if(a==='calc'){runCalc();return;}
});
modal.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='calcIn'){e.preventDefault();runCalc();}});
modal.addEventListener('click',e=>{if(e.target===modal)closeM();});
function runCalc(){const inp=$('#calcIn'),out=$('#calcOut');if(!inp)return;G.calcExpr=inp.value;
 const s=inp.value.replace(/,/g,'.').replace(/\s/g,'');
 if(!/^[0-9.+\-*/()]+$/.test(s)){out.textContent='Use só números e + - * / ( )';return;}
 try{const v=Function('"use strict";return ('+s+')')();out.textContent=Number.isFinite(v)?'= '+nf(Math.round(v*1000)/1000):'Conta inválida';}catch(err){out.textContent='Conta inválida';}}

function findExam(tool,z){
 const c=G.c;
 if(z==='geral')return c.geral;
 const k=tool+':'+z;if(c.exam[k])return c.exam[k];
 if(/^(apice|medio|base)[DE]$/.test(z)){
  const side=z.slice(-1),eff=z.startsWith('base')&&c.effSides.includes(side);
  return {inspecionar:eff?'Expansibilidade reduzida deste lado.':'Expansibilidade simétrica, sem abaulamentos.',
   palpar:eff?'Frêmito toracovocal abolido.':'Frêmito toracovocal presente e normal.',
   percutir:eff?'Som maciço.':'Som claro pulmonar.',
   auscultar:eff?'Murmúrio vesicular abolido.':'Murmúrio vesicular presente, sem ruídos adventícios.'}[tool];
 }
 const D={
  pescoco:{inspecionar:'Jugulares sem turgência a 45°.',palpar:'Sem linfonodos palpáveis. Refluxo hepatojugular negativo.',percutir:'Não ajuda aqui.',auscultar:'Sem sopros carotídeos.'},
  coracao:{inspecionar:'Ictus não visível.',palpar:'Ictus no 5º espaço intercostal, linha hemiclavicular.',percutir:'Não ajuda muito aqui.',auscultar:'Ritmo regular em 2 tempos, bulhas normofonéticas, sem sopros.'},
  abdome:{inspecionar:'Abdome plano.',palpar:'Flácido, indolor, sem visceromegalias.',percutir:'Timpânico, sem macicez móvel.',auscultar:'Ruídos hidroaéreos presentes.'},
  pernas:{inspecionar:'Sem edema.',palpar:'Sem edema, panturrilhas livres.',percutir:'Não se aplica.',auscultar:'Não se aplica.'}
 };
 return D[z][tool];
}

function doTap(){
 const c=G.c,t=G.tap,{s,i}=t.space;advance(20);G.tapAttempts++;
 const imaging=ready('laurell')||ready('usg');
 if(!imaging&&!G.tapEv.some(e=>e.k==='noimg'))G.tapEv.push({k:'noimg',t:'Puncionou sem confirmar líquido livre por Laurell ou USG.',p:4});
 if(i===9){G.tapEv.push({k:'low',t:'Punção baixa demais: risco de atingir fígado, baço ou diafragma. Procedimento interrompido.',p:5});
  t.msg='<div class="event">Muito baixo. Você sentiu resistência e recuou. Abaixo do diafragma ficam fígado e baço. Nenhum líquido.</div>';return;}
 if(!c.tap.sides.includes(s)||!c.tap.spaces.includes(i)){G.tapEv.push({k:'dry'+G.tapAttempts,t:'Punção seca ('+i+'º espaço, lado '+(s==='D'?'direito':'esquerdo')+').',p:3});
  t.msg='<div class="event">Punção seca. Nenhum líquido veio, e o paciente reclamou da dor. Onde está o derrame?</div>';return;}
 let msg='';
 if(t.pos==='inf'){G.tapEv.push({k:'bleed',t:'Agulha rente à borda inferior da costela de cima: sangramento do feixe vasculonervoso.',p:5});msg+='<div class="event">Veio sangue vivo antes do líquido. A agulha passou junto ao feixe vasculonervoso intercostal.</div>';}
 if(t.pos==='meio'){G.tapEv.push({k:'mid',t:'Agulha no meio do espaço: funcionou, mas o mais seguro é rente à borda superior da costela de baixo.',p:2});}
 if(t.vol==='2000'){G.tapEv.push({k:'reexp',t:'Retirou cerca de 2.000 mL: edema de reexpansão (tosse e queda da saturação).',p:5});msg+='<div class="event">Perto dos 2 litros o paciente começou a tossir sem parar e a saturação caiu. Edema de reexpansão.</div>';}
 G.tapped=true;t.msg=msg;
}

function score(){
 const c=G.c,f=G.final;
 const hit=(groups,arr)=>groups.filter(g=>g.ids.some(id=>arr.includes(id)));
 const qH=hit(c.keyQ,G.asked),eH=hit(c.keyExam,G.examined),xH=hit(c.keyEx,Object.keys(G.orders)),fH=hit(c.keyFluid,Object.keys(G.fluid));
 const keyIds=c.keyEx.flatMap(g=>g.ids);
 const extra=Object.keys(G.orders).filter(id=>!keyIds.includes(id)&&!c.neutral.includes(id));
 const pen=G.tapEv.reduce((s,e)=>s+e.p,0);
 const okT=c.conduta.filter(x=>x.ok).length,okH=c.conduta.filter(x=>x.ok&&f.cond.includes(x.id)).length,wr=c.conduta.filter(x=>!x.ok&&f.cond.includes(x.id)).length;
 const s={
  q:Math.round(MAX.q*qH.length/c.keyQ.length),
  ex:Math.round(MAX.ex*eH.length/c.keyExam.length),
  lab:Math.max(0,Math.round(MAX.lab*xH.length/c.keyEx.length)-2*extra.length),
  proc:G.tapped?Math.max(0,MAX.proc-pen):0,
  fl:Math.round(MAX.fl*fH.length/c.keyFluid.length),
  cls:f.cls===c.correctClass?MAX.cls:0,
  dx:f.dx===c.correctDx?MAX.dx:0,
  cond:Math.max(0,Math.round(MAX.cond*okH/okT)-4*wr)
 };
 s.total=Object.values(s).reduce((a,b)=>a+b,0);
 s.miss={q:c.keyQ.filter(g=>!qH.includes(g)),ex:c.keyExam.filter(g=>!eH.includes(g)),lab:c.keyEx.filter(g=>!xH.includes(g)),fl:c.keyFluid.filter(g=>!fH.includes(g))};
 s.extra=extra;return s;
}
function lightText(){
 const L=G.c.light,rp=L.protL/L.protS,rl=L.ldhL/L.ldhS;
 return `Proteína ${nf(L.protL)}/${nf(L.protS)} = ${nf(rp.toFixed(2))} (${rp>.5?'> 0,5':'≤ 0,5'}) · DHL ${L.ldhL}/${L.ldhS} = ${nf(rl.toFixed(2))} (${rl>.6?'> 0,6':'≤ 0,6'}) · DHL do líquido ${L.ldhL} ${L.ldhL>133?'>':'≤'} 133 (2/3 de 200).`;
}
function finish(){
 const c=G.c,s=score(),f=G.final;
 const prev=store('best-'+c.id);if(prev===undefined||s.total>prev)store('best-'+c.id,s.total);
 const verdict=s.total>=90?'Plantonista exemplar':s.total>=70?'Bom plantão':s.total>=50?'Dá para melhorar':'Vale revisar o resumo';
 const bars=[['Anamnese',s.q,MAX.q],['Exame físico',s.ex,MAX.ex],['Exames',s.lab,MAX.lab],['Toracocentese',s.proc,MAX.proc],['Análise do líquido',s.fl,MAX.fl],['Classificação',s.cls,MAX.cls],['Diagnóstico',s.dx,MAX.dx],['Conduta',s.cond,MAX.cond]];
 const missList=(arr,title)=>arr.length?`<h3 class="sec">${title}</h3><ul class="miss">${arr.map(g=>`<li>${g.l}</li>`).join('')}</ul>`:'';
 const next=(G.ci+1)%CASES.length;
 const d=$('#debrief');
 d.innerHTML=`<div class="deb">
  <p class="mono muted">${c.n.toUpperCase()} · ${c.title.toUpperCase()} · ENCERRADO ÀS ${fmtT(G.clock)}</p>
  <div class="score"><span class="big">${s.total}</span><span class="mono muted">/ 100</span></div>
  <h2 style="font-size:1.6rem;margin-top:4px">${verdict}</h2>
  <div class="bars">${bars.map(b=>`<div class="bar"><span>${b[0]}</span><div class="tr"><i style="width:${Math.round(100*b[1]/b[2])}%"></i></div><span class="nm">${b[1]}/${b[2]}</span></div>`).join('')}</div>

  <h3 class="sec">Classificação: ${f.cls===c.correctClass?'acertou':'errou'} (${c.correctClass})</h3>
  <p class="muted" style="font-size:.92rem">${lightText()}</p>${c.clsNote?`<p style="font-size:.92rem;margin-top:6px">${c.clsNote}</p>`:''}
  <h3 class="sec">Diagnóstico: ${DX.find(x=>x.id===c.correctDx).t}</h3>
  <p style="font-size:.92rem">${f.dx===c.correctDx?'Você acertou. ':'Você marcou: '+DX.find(x=>x.id===f.dx).t+'. '}${c.dxWhy}</p>

  ${missList(s.miss.q,'Perguntas que fariam diferença')}
  ${missList(s.miss.ex,'Exame físico que faltou')}
  ${missList(s.miss.lab,'Exames que faltaram')}
  ${s.extra.length?`<h3 class="sec">Exames desnecessários (−2 cada)</h3><ul class="miss">${s.extra.map(id=>`<li>${exName(id)}</li>`).join('')}</ul>`:''}
  ${G.tapped?missList(s.miss.fl,'Análises do líquido que faltaram'):'<h3 class="sec">Você não colheu o líquido pleural</h3>'}
  ${G.tapEv.length?`<h3 class="sec">Intercorrências no procedimento</h3><ul class="miss">${G.tapEv.map(e=>`<li>${e.t} (−${e.p})</li>`).join('')}</ul>`:''}

  <h3 class="sec">Revisão da conduta</h3>
  <div class="cond">${c.conduta.map(x=>{const p=f.cond.includes(x.id);const k=x.ok&&p?'ok':!x.ok&&p?'no':x.ok?'mi':'';const lab=x.ok&&p?'Acertou':!x.ok&&p?'Conduta errada':x.ok?'Faltou marcar':'Bem ignorada';return `<div class="${k}">${x.t}<small><b>${lab}.</b> ${x.why}</small></div>`;}).join('')}</div>

  <h3 class="sec">O que levar deste caso</h3>
  <div class="learn">${c.teaching.map(t=>`<div><b>${t.t}</b><p>${t.p}</p></div>`).join('')}</div>
  <div class="row" style="margin-top:20px">
   <button class="btn" data-go="start" data-i="${next}">Próximo caso</button>
   <button class="btn ghost" data-go="start" data-i="${G.ci}">Repetir este caso</button>
   <button class="btn ghost" data-go="home">Início</button></div>
  <p class="foot">Pacientes fictícios, criados a partir do resumo de Derrame Pleural (Estratégia MED). Confira com o seu material e com as diretrizes atuais.</p></div>`;
 show('debrief');
}

/* ================= TELAS ================= */
function show(id){['home','game','debrief'].forEach(s=>$('#'+s).hidden=s!==id);window.scrollTo(0,0);}
function renderHome(){
 $('#home').innerHTML=`<div class="hero"><h1>Plantão Pleural</h1>
  <p>Noite de plantão na emergência. Três pacientes com derrame pleural. Você conversa, examina, pede exames, lê a radiografia sem laudo, punciona e decide. Ninguém vai te dizer o que é importante.</p></div>
 <div class="cases">${CASES.map((c,i)=>{const b=store('best-'+c.id);return `<button class="ccard" data-go="start" data-i="${i}"><canvas data-por="${c.look}"></canvas><div><span class="n">${c.n.toUpperCase()}</span><h3>${c.title}</h3><p>${c.card}</p><span class="best">${b!==undefined?'Recorde: '+b+'/100':'Ainda não atendido'}</span></div></button>`;}).join('')}</div>
 <div class="how"><div><b>Ande pela sala</b>WASD ou setas no computador. No celular, toque onde quer ir.</div>
  <div><b>Investigue</b>Perguntas, manobras e exames gastam tempo. Pedir tudo tira pontos.</div>
  <div><b>Interprete</b>Resultados vêm crus. A radiografia vem sem laudo. Light é com você.</div></div>
 <p class="foot">Casos fictícios construídos a partir de "Resumos Estratégicos: Derrame Pleural" (Estratégia MED, Prof. Philippe Colares). Material de estudo. Não substitui o julgamento clínico.</p>`;
 document.querySelectorAll('[data-por]').forEach(c=>drawPortrait(c,c.dataset.por,'sick'));
}
function startCase(i){newGame(i);$('#hudCase').textContent=G.c.n+' · '+G.c.title;$('#hudClock').textContent=fmtT(0);show('game');
 setTimeout(()=>{openM('nurse');},250);}
document.addEventListener('click',e=>{const el=e.target.closest('[data-go]');if(!el)return;
 if(el.dataset.go==='start')startCase(+el.dataset.i);else{G=null;renderHome();show('home');}});
document.querySelectorAll('[data-hud]').forEach(b=>b.addEventListener('click',()=>{
 const a=b.dataset.hud;if(!G)return;
 if(a==='notes')openM('notes',{tab:'talk'});
 if(a==='wait'){advance(15);toast('15 minutos depois...');}
 if(a==='help')openM('help');
 if(a==='quit'){closeM();G=null;renderHome();show('home');}
}));

/* ================= LOOP ================= */
function interact(o){G.target=null;G.pending=null;
 const k=o.act;if(k==='patient')openM('patient',{tab:'talk'});else if(k==='pc')openM('pc',{tab:Object.keys(G.orders).some(ready)?'res':'order'});else if(k==='close')openM('close');else openM(k);}
const KEYMAP={arrowup:'u',w:'u',arrowdown:'d',s:'d',arrowleft:'l',a:'l',arrowright:'r',d:'r'};
window.addEventListener('keydown',e=>{
 if(!G||$('#game').hidden)return;
 const k=e.key.toLowerCase();
 if(G.modal){if(k==='escape')closeM();return;}
 if(KEYMAP[k]){G.keys[KEYMAP[k]]=1;G.target=null;e.preventDefault();}
 if((k==='e'||k===' '||k==='enter')&&G.near){e.preventDefault();interact(G.near);}
 if(k==='n')openM('notes',{tab:'talk'});
});
window.addEventListener('keyup',e=>{if(!G)return;const k=KEYMAP[e.key.toLowerCase()];if(k)G.keys[k]=0;});
window.addEventListener('blur',()=>{if(G)G.keys={};});
cv.addEventListener('click',e=>{
 if(!G||G.modal)return;const r=cv.getBoundingClientRect();
 const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
 const hit=Object.values(OBJ).find(o=>{const q=o.r;return x>=q[0]-10&&x<=q[0]+q[2]+10&&y>=q[1]-24&&y<=q[1]+q[3]+10;});
 if(hit){G.target={...hit.ip};G.pending=hit;}else{G.target={x,y};G.pending=null;}
 G.stuck=0;
});
$('#actBtn').addEventListener('click',()=>{if(G&&G.near&&!G.modal)interact(G.near);});

let last=performance.now();
function loop(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
 if(G&&!$('#game').hidden){
  let vx=0,vy=0;
  if(!G.modal){
   if(G.keys.u)vy-=1;if(G.keys.d)vy+=1;if(G.keys.l)vx-=1;if(G.keys.r)vx+=1;
   if(!vx&&!vy&&G.target){const dx=G.target.x-G.pos.x,dy=G.target.y-G.pos.y,dist=Math.hypot(dx,dy);
    if(dist<3){const p=G.pending;G.target=null;if(p){interact(p);}}else{vx=dx/dist;vy=dy/dist;}}
  }
  const mv=vx||vy;
  if(mv){const n=Math.hypot(vx,vy)||1,sp=78*dt;const nx=G.pos.x+vx/n*sp,ny=G.pos.y+vy/n*sp;let moved=false;
   if(!blocked(nx,G.pos.y)){G.pos.x=nx;moved=true;}if(!blocked(G.pos.x,ny)){G.pos.y=ny;moved=true;}
   if(Math.abs(vx)>Math.abs(vy))G.dir=vx<0?'left':'right';else G.dir=vy<0?'up':'down';
   if(!moved&&G.target){G.stuck=(G.stuck||0)+dt;if(G.stuck>.4){G.target=null;G.pending=null;}}}
  G.moving=!!mv;
  let near=null,best=30;Object.values(OBJ).forEach(o=>{const d=Math.hypot(o.ip.x-G.pos.x,o.ip.y-G.pos.y);if(d<best){best=d;near=o;}});
  G.near=near;
  const ab=$('#actBtn');if(near&&!G.modal){ab.hidden=false;ab.textContent=near.lbl();}else ab.hidden=true;
  ctx.imageSmoothingEnabled=false;
  drawRoom(t);
  const ents=[{y:G.pos.y,d:()=>drawPerson(G.pos.x,G.pos.y,LOOKS.doctor,t,G.moving,G.dir)},{y:238,d:()=>drawPerson(176,238,LOOKS.nurse,t,false,'up')}].sort((a,b)=>a.y-b.y);
  ents.forEach(e=>e.d());
  const unseenLab=Object.keys(G.orders).some(id=>id!=='rx'&&ready(id)&&!G.seen[id])||Object.keys(G.fluid).some(id=>fready(id)&&!G.seen['f_'+id]);
  if(unseenLab)drawBang(363,40,t);
  if(ready('rx')&&!G.seen.rx)drawBang(252,10+12,t);
  if(near&&!G.modal)drawPrompt(near);
 }
 requestAnimationFrame(loop);
}
renderHome();requestAnimationFrame(loop);
</script>
