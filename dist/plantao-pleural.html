<title>Plantão Pleural</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#0e171d;--panel:#15232c;--panel2:#1c2e39;--line:#2b4250;--ink:#e6eff2;--muted:#94aab3;
  --accent:#5ad1c3;--accent-ink:#06211e;--warn:#f2b45a;--bad:#ef7d6d;--good:#7fd99a;
  --f-pixel:'Pixelify Sans','Courier New',monospace;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-body);margin:0;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto}
h1,h2,h3{font-family:var(--f-pixel);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 16px;font-weight:600;min-height:42px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 10px;min-height:34px;font-size:.85rem}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}

/* home */
.hero{display:grid;gap:14px;padding:18px 0 6px}
.hero h1{font-size:clamp(2.2rem,7vw,3.6rem);color:var(--accent);letter-spacing:.02em}
.hero p{max-width:58ch;color:var(--muted);font-size:1.02rem}
.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:22px}
.ccard{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:14px;text-align:left;display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:start;transition:border-color .15s,transform .15s}
.ccard:hover{border-color:var(--accent);transform:translateY(-2px)}
.ccard canvas{width:72px;height:72px;image-rendering:pixelated;border-radius:8px;background:var(--panel2)}
.ccard .n{font:500 .72rem var(--f-mono);color:var(--accent);letter-spacing:.08em}
.ccard h3{font-size:1.15rem;margin:2px 0 4px}
.ccard p{font-size:.88rem;color:var(--muted)}
.ccard .best{font:500 .75rem var(--f-mono);color:var(--warn);margin-top:6px;display:block}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:22px}
.how div{background:var(--panel);border-radius:10px;padding:12px 14px;font-size:.9rem;color:var(--muted)}
.how b{display:block;color:var(--ink);font-family:var(--f-pixel);font-size:1.05rem;margin-bottom:2px}
.foot{margin-top:26px;font-size:.8rem;color:var(--muted);max-width:72ch}

/* game */
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.hud .who{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.hud .who b{font-family:var(--f-pixel);font-size:1.15rem}
.clock{font:500 1rem var(--f-mono);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 10px;color:var(--warn)}
.hud .tools{display:flex;gap:6px;flex-wrap:wrap}
.stage{position:relative;border:3px solid var(--line);border-radius:10px;overflow:hidden;background:#000;max-width:100%}
#cv{display:block;width:100%;height:auto;image-rendering:pixelated;touch-action:manipulation;cursor:pointer}
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:grid;gap:6px;pointer-events:none;width:max-content;max-width:90%}
#toast div{background:rgba(10,20,26,.92);border:1px solid var(--accent);color:var(--ink);padding:6px 12px;border-radius:6px;font-size:.85rem;animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
#actBtn{position:absolute;right:10px;bottom:10px;background:var(--warn);color:#2a1a00;border:0;border-radius:8px;padding:8px 14px;font-family:var(--f-pixel);font-size:1rem;box-shadow:0 3px 0 #9c6a1d}
.ctrl{margin-top:10px;font-size:.85rem;color:var(--muted)}
.ctrl kbd{font-family:var(--f-mono);background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:.78rem;color:var(--ink)}

/* modal */
#modal{position:fixed;inset:0;background:rgba(3,8,11,.72);display:flex;align-items:flex-end;justify-content:center;z-index:50;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
@media(min-width:700px){#modal{align-items:center}}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:14px;width:100%;max-width:800px;max-height:100%;display:flex;flex-direction:column;box-shadow:0 20px 50px -20px #000}
.panel header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel header h2{font-size:1.3rem}
.panel .x{background:var(--panel2);border:1px solid var(--line);border-radius:8px;width:38px;height:38px;font-size:1.1rem}
.pbody{padding:14px 16px 18px;overflow-y:auto;min-height:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:.85rem}
.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.talk{display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;align-items:start}
.talk canvas{width:88px;height:88px;image-rendering:pixelated;border-radius:10px;background:var(--panel2);border:2px solid var(--line)}
.bubble{background:#f4efe2;color:#1d2328;border-radius:12px;padding:12px 14px;min-height:64px;font-size:.98rem;position:relative}
.bubble::before{content:"";position:absolute;left:-8px;top:18px;border:8px solid transparent;border-right-color:#f4efe2;border-left:0}
.bubble .nm{display:block;font:700 .9rem var(--f-pixel);color:#3c6e68;margin-bottom:2px}
.qcat{margin-top:12px}
.qcat h4{margin:0 0 6px;font:500 .7rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:.88rem;text-align:left}
.chip:hover{border-color:var(--accent)}
.chip.done{opacity:.5}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);opacity:1}
.examgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:10px}
.fig{background:var(--panel2);border-radius:10px;padding:8px;text-align:center}
.fig h4{margin:0 0 4px;font:500 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fig svg{width:100%;max-width:260px;height:auto}
.zone{fill:rgba(90,209,195,.08);stroke:rgba(90,209,195,.35);stroke-width:1;cursor:pointer;transition:fill .12s}
.zone:hover{fill:rgba(90,209,195,.3)}
.zone.hit{fill:rgba(242,180,90,.22)}
.space{fill:transparent;cursor:pointer}
.space:hover{fill:rgba(90,209,195,.25)}
.space.sel{fill:rgba(242,180,90,.55)}
.flog{margin-top:12px;display:grid;gap:6px}
.flog div{background:var(--panel2);border-left:3px solid var(--accent);border-radius:6px;padding:7px 10px;font-size:.9rem}
.flog div b{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);display:block;font-weight:500}
.list{display:grid;gap:6px}
.check{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;font-size:.92rem}
.check input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.check .tm{margin-left:auto;font:500 .75rem var(--f-mono);color:var(--muted);white-space:nowrap}
.res{background:var(--panel2);border-radius:8px;padding:9px 12px;font-size:.92rem}
.res b{display:block;font:500 .75rem var(--f-mono);color:var(--muted);font-weight:500}
.res .v{font-family:var(--f-mono)}
.res.wait .v{color:var(--muted);font-style:italic}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.note{background:rgba(242,180,90,.12);border-left:3px solid var(--warn);border-radius:6px;padding:9px 12px;font-size:.9rem;margin-top:10px}
.event{background:rgba(239,125,109,.12);border-left:3px solid var(--bad);border-radius:6px;padding:9px 12px;font-size:.92rem;margin-top:10px}
.okmsg{background:rgba(127,217,154,.12);border-left:3px solid var(--good);border-radius:6px;padding:9px 12px;font-size:.92rem;margin-top:10px}
.opts{display:grid;gap:6px;margin-top:8px}
.opts label{display:flex;gap:8px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.9rem;cursor:pointer}
.opts input{accent-color:var(--accent);margin-top:3px}
.tapwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media(max-width:640px){.tapwrap{grid-template-columns:minmax(0,1fr)}}
.tapwrap svg{width:100%;height:auto;background:#d9c2a8;border-radius:10px}
.rxbox{display:flex;justify-content:center;background:#000;border-radius:10px;padding:10px}
.rxbox canvas{width:100%;max-width:320px;height:auto}
.calc{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.calc input{flex:1 1 200px;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--ink);font:500 1rem var(--f-mono)}
.calcout{font:500 1.2rem var(--f-mono);color:var(--warn);margin-top:8px;min-height:1.6em}
h3.sec{font-size:1.05rem;margin:16px 0 8px}

/* debrief */
.deb{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:20px}
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .big{font:700 4.4rem/1 var(--f-pixel);color:var(--accent)}
.bars{display:grid;gap:8px;margin:16px 0}
.bar{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;font-size:.9rem}
@media(max-width:480px){.bar{grid-template-columns:96px 1fr 46px}}
.bar .tr{height:10px;background:var(--panel2);border-radius:5px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--accent)}
.bar .nm{font-family:var(--f-mono);text-align:right;font-size:.8rem}
.miss{display:grid;gap:6px}
.miss li{font-size:.9rem}
.cond{display:grid;gap:6px}
.cond div{background:var(--panel2);border-radius:8px;padding:9px 12px;border-left:3px solid var(--line);font-size:.92rem}
.cond .ok{border-color:var(--good)}.cond .no{border-color:var(--bad)}.cond .mi{border-color:var(--warn)}
.cond small{display:block;color:var(--muted);margin-top:2px}
.learn{display:grid;gap:10px}
.learn div{border-left:3px solid var(--accent);padding-left:12px}
.learn b{font-family:var(--f-pixel);font-size:1.02rem}

/* casos da IA */
.iabox{background:var(--panel);border:2px dashed var(--line);border-radius:12px;padding:16px;margin-top:22px;display:grid;gap:8px}
.iabox h2{font-size:1.3rem;color:var(--accent)}
.iabox .lbl{font:500 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.iabox textarea,.iabox select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--ink);font:400 .95rem var(--f-body);padding:9px 12px;width:100%;resize:vertical}
.iabox select{width:auto;min-height:42px}
.iabox .row{margin-top:4px}
.filebtn{position:relative;display:inline-flex;align-items:center;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-size:inherit}
.iastatus{display:grid;gap:6px}
.iastatus .note,.iastatus .event,.iastatus .okmsg{margin-top:0}
.iawait{font-size:.9rem;color:var(--warn);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.modh{font-size:1.25rem;margin-top:24px;color:var(--warn)}
.modh+.cases{margin-top:10px}
</style>

<div class="wrap">
  <section id="home"></section>
  <section id="game" hidden>
    <div class="hud">
      <div class="who"><b id="hudCase"></b><span class="clock" id="hudClock">19:00</span></div>
      <div class="tools">
        <button class="btn ghost small" data-hud="notes">Caderneta</button>
        <button class="btn ghost small" data-hud="wait">Esperar 15 min</button>
        <button class="btn ghost small" data-hud="help">Ajuda</button>
        <button class="btn ghost small" data-hud="quit">Sair</button>
      </div>
    </div>
    <div class="stage">
      <canvas id="cv" width="480" height="288" aria-label="Sala de emergência"></canvas>
      <div id="toast"></div>
      <button id="actBtn" hidden></button>
    </div>
    <p class="ctrl">Ande com <kbd>WASD</kbd> ou setas, interaja com <kbd>E</kbd>. No celular, toque no lugar ou na pessoa para ir até lá. <kbd>N</kbd> abre a caderneta.</p>
  </section>
  <section id="debrief" hidden></section>
</div>
<div id="modal" hidden><div class="panel" role="dialog" aria-modal="true"><header><h2 id="mTitle"></h2><button class="x" data-m="close" aria-label="Fechar">✕</button></header><div class="pbody" id="mBody"></div></div></div>

// ---- js/ia.js ----
/* Casos criados por IA a partir do material do aluno.
   Funciona só na versão publicada no Claude: usa o Claude da própria pessoa (claude.use("sample")).
   Nesta etapa a IA só monta casos de derrame pleural, usando as mesmas perguntas, exames,
   análises e diagnósticos de js/dados.js. Tudo o que ela devolve passa por iaValidar antes de entrar no jogo.
   Os casos ficam guardados no navegador de quem criou. */
const IA_CHAVE='plantao-pleural-ia';
const IA_LOOKS={carlos:'homem adulto, bigode',maria:'mulher idosa, óculos, cabelo grisalho',joao:'homem jovem, cabelo cacheado',severino:'homem idoso, calvo',ana:'mulher jovem, cabelo longo',bruno:'homem jovem, magro',lucia:'mulher adulta, cabelo longo',pedro:'homem de meia-idade, calvo, óculos',tonho:'homem idoso, cabelo branco, bigode',raimundo:'homem idoso, calvo',carla:'mulher jovem, ruiva',davi:'rapaz, cabelo cacheado',marcos:'homem adulto'};
const IA_ZONAS=Object.keys(ZNAME).filter(z=>z!=='geral');

function iaLer(){try{return JSON.parse(localStorage.getItem(IA_CHAVE)||'[]');}catch(e){return [];}}
function iaGravar(lista){try{localStorage.setItem(IA_CHAVE,JSON.stringify(lista));}catch(e){}}
function iaRenumerar(){let k=0;CASES.forEach(c=>{if(c.ia)c.n='IA '+(++k);});}
iaLer().forEach(c=>{c.modulo='Feitos pela IA';c.correctSind=c.correctSind||'derrame';CASES.push(c);});iaRenumerar();

// Classificação que os números de Light (e gradientes, se usa diurético) mandam.
function iaClasse(L,diuretico){
 const light=L.protL/L.protS>.5||L.ldhL/L.ldhS>.6||L.ldhL>200*2/3;
 const grad=(L.protS-L.protL)>3.1||(L.albS-L.albL)>1.2;
 return light&&!(diuretico&&grad)?'exsudato':'transudato';
}

// Confere e arruma o que a IA mandou. Devolve {caso, graves, avisos}. Com algum problema grave o caso não entra.
function iaValidar(bruto,fonte){
 const graves=[],avisos=[];
 const limpa=v=>typeof v==='string'?v.replace(/<(?=[A-Za-z\/!?])/g,'‹').trim():Array.isArray(v)?v.map(limpa):v&&typeof v==='object'?Object.fromEntries(Object.entries(v).map(([k,x])=>[k,limpa(x)])):v;
 const r=limpa(bruto||{}),txt=v=>typeof v==='string'&&v.length>0;
 const num=v=>{const n=typeof v==='string'?parseFloat(v.replace(',','.')):v;return typeof n==='number'&&isFinite(n)&&n>0?n:null;};
 const ids=lista=>new Set(lista.map(x=>x.id));
 const qIds=ids(QUESTIONS),exIds=ids(EXAMS),flIds=ids(FLUID_TESTS),dxIds=ids(DX);
 const manobra=id=>id==='vitals'||id==='inspecionar:geral'||(()=>{const[t,z]=String(id).split(':');return TOOLS.some(x=>x.id===t)&&IA_ZONAS.includes(z);})();
 const grupos=(lista,valido,nome)=>{const out=(Array.isArray(lista)?lista:[]).map(g=>({ids:(Array.isArray(g&&g.ids)?g.ids:[]).map(String).filter(valido),l:txt(g&&g.l)?g.l:''})).filter(g=>g.ids.length&&g.l);
  if(!out.length)graves.push('nenhum item que vale ponto em '+nome);return out;};
 const so=(obj,valido)=>Object.fromEntries(Object.entries(obj&&typeof obj==='object'?obj:{}).filter(([k,v])=>valido(k)&&txt(v)));

 const c={id:'ia-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),n:'IA',ia:true,modulo:'Feitos pela IA',correctSind:'derrame',sindWhy:'Macicez, frêmito e murmúrio abolidos onde há líquido: síndrome de derrame pleural.',fonte:txt(fonte)?limpa(fonte).slice(0,120):'material do aluno'};
 ['title','card','pname','briefing','vitals','geral','fluidLook','dxWhy'].forEach(k=>{if(txt(r[k]))c[k]=r[k];else graves.push('faltou '+k);});
 c.look=IA_LOOKS[r.look]?r.look:'carlos';
 c.answers={};QUESTIONS.forEach(q=>{const a=r.answers&&r.answers[q.id];if(txt(a))c.answers[q.id]=a;else{c.answers[q.id]='Não sei dizer, doutor.';avisos.push('sem resposta para '+q.id);}});
 c.keyQ=grupos(r.keyQ,id=>qIds.has(id),'anamnese');
 c.effSides=(Array.isArray(r.effSides)?r.effSides:[]).filter(s=>s==='D'||s==='E');c.effSides=[...new Set(c.effSides)];
 if(!c.effSides.length)graves.push('não disse o lado do derrame');
 c.exam=so(r.exam,manobra);
 c.keyExam=grupos(r.keyExam,manobra,'exame físico');
 c.res=so(r.res,id=>exIds.has(id)&&id!=='sprot'&&id!=='sdhl');
 c.keyEx=grupos(r.keyEx,id=>exIds.has(id),'exames');
 const chave=c.keyEx.flatMap(g=>g.ids);
 c.neutral=[...new Set((Array.isArray(r.neutral)?r.neutral:[]).map(String))].filter(id=>exIds.has(id)&&!chave.includes(id));
 const rx=r.rx&&typeof r.rx==='object'?r.rx:{},eff={};
 c.effSides.forEach(s=>{const v=num(rx.eff&&rx.eff[s]);eff[s]=v?Math.min(.5,Math.max(.1,v)):.35;});
 c.rx={eff};if(rx.cardio)c.rx.cardio=1;if(rx.consol==='D'||rx.consol==='E')c.rx.consol=rx.consol;
 const tap=r.tap&&typeof r.tap==='object'?r.tap:{};
 c.tap={sides:(Array.isArray(tap.sides)?tap.sides:[]).filter(s=>c.effSides.includes(s)),spaces:[...new Set((Array.isArray(tap.spaces)?tap.spaces:[]).map(Number))].filter(n=>Number.isInteger(n)&&n>=1&&n<=8).sort((a,b)=>a-b)};
 if(!c.tap.sides.length)c.tap.sides=c.effSides.slice();
 if(!c.tap.spaces.length){c.tap.spaces=[6,7,8];avisos.push('espaços da punção ajustados');}
 c.fluidColor=/^#[0-9a-fA-F]{6}$/.test(r.fluidColor||'')?r.fluidColor:'#e8cd5e';
 const L=r.light&&typeof r.light==='object'?r.light:{};
 c.light={};['protL','protS','ldhL','ldhS','albL','albS'].forEach(k=>{const v=num(L[k]);if(v)c.light[k]=v;else graves.push('faltou o valor '+k+' de Light');});
 c.fluid=so(r.fluid,id=>flIds.has(id));
 if(Object.keys(c.light).length===6){ // o texto do líquido precisa bater com os números de Light
  c.fluid.prot='Proteínas totais '+nf(c.light.protL)+' g/dL';c.fluid.dhl='DHL '+c.light.ldhL+' UI/L';c.fluid.alb='Albumina '+nf(c.light.albL)+' g/dL';}
 c.keyFluid=grupos(r.keyFluid,id=>flIds.has(id),'análise do líquido');
 if(r.diuretico===true)c.diuretico=true;
 c.correctClass=r.correctClass==='transudato'?'transudato':r.correctClass==='exsudato'?'exsudato':null;
 if(!c.correctClass)graves.push('não disse se é transudato ou exsudato');
 else if(Object.keys(c.light).length===6&&iaClasse(c.light,c.diuretico)!==c.correctClass)graves.push(`os números de Light dão ${iaClasse(c.light,c.diuretico)}, mas o caso diz ${c.correctClass}`);
 if(txt(r.clsNote))c.clsNote=r.clsNote;
 c.correctDx=dxIds.has(r.correctDx)?r.correctDx:null;if(!c.correctDx)graves.push('diagnóstico fora da lista do jogo');
 c.conduta=(Array.isArray(r.conduta)?r.conduta:[]).filter(x=>x&&txt(x.t)&&txt(x.why)).slice(0,10).map((x,i)=>({id:'c'+(i+1),t:x.t,ok:x.ok===true||x.ok===1?1:0,why:x.why}));
 if(!c.conduta.some(x=>x.ok))graves.push('nenhuma conduta certa');
 if(!c.conduta.some(x=>!x.ok))graves.push('nenhuma conduta errada para o aluno descartar');
 c.teaching=(Array.isArray(r.teaching)?r.teaching:[]).filter(x=>x&&txt(x.t)&&txt(x.p)).slice(0,6);
 if(!c.teaching.length)graves.push('faltaram os pontos para levar');
 return {caso:c,graves,avisos};
}

function iaPrompt(material,feitos,temFotos){
 const exemplo=Object.assign({},CASES.find(c=>c.id==='tb')||CASES[0]);
 ['id','n','ia','fonte','modulo','correctSind','sindWhy'].forEach(k=>delete exemplo[k]);
 return `Você é um professor de medicina que escreve casos clínicos para um jogo de estudo. O aluno é o médico de plantão: conversa com o paciente, examina, pede exames, faz toracocentese e decide classificação, diagnóstico e conduta.

TAREFA: crie UM caso clínico de derrame pleural baseado SOMENTE no material de estudo do aluno abaixo${temFotos?' (e nas fotos das páginas enviadas junto)':''}.

REGRAS
1. Conteúdo médico só do material: critérios, valores de corte, achados e condutas precisam estar no material. Não invente o que o material não diz. O "dxWhy", a "conduta" e o "teaching" devem citar os critérios do material.
2. Se o material não tratar de derrame pleural, responda só {"erro":"explique em uma frase"}.
3. Paciente fictício: nome e história inventados, brasileiro, linguagem leiga nas respostas, em português do Brasil.
4. Nada mastigado: o briefing, as respostas e os resultados não dizem o que é importante nem chamam valor de alterado. Resultados crus, com unidade e referência quando fizer sentido.
5. Coerência dos números: os 6 valores de "light" (proteína e DHL do líquido e do soro, albumina do líquido e do soro) precisam levar à "correctClass" pelos critérios de Light (proteína líquido/soro > 0,5; DHL líquido/soro > 0,6; DHL do líquido > 2/3 do limite superior do soro, que no jogo é 200, ou seja > 133). Se o paciente usa diurético ("diuretico": true), gradiente de proteína soro−líquido > 3,1 g/dL ou de albumina > 1,2 g/dL torna transudato.
6. Use SÓ os ids das listas abaixo. Responda TODAS as perguntas.
7. Escolha um diagnóstico diferente destes já criados: ${feitos.length?feitos.join(', '):'(nenhum ainda)'}. Varie idade, sexo e lado do derrame.
8. Misture condutas certas e erradas plausíveis (5 a 8 no total), cada uma com o porquê.

LISTAS DO JOGO
Perguntas (answers e keyQ): ${QUESTIONS.map(q=>q.id+' = "'+q.t+'"').join('; ')}

Exames (res, keyEx, neutral): ${EXAMS.map(e=>e.id+' = '+e.t).join('; ')}. Proteínas e DHL séricos saem de "light", não escreva em "res". Exame que não estiver em "res" mostra este padrão normal: ${JSON.stringify(DEF_RES)}. Exame fora de keyEx e neutral tira ponto do aluno.
Análises do líquido (fluid e keyFluid): ${FLUID_TESTS.map(f=>f.id+' = '+f.t).join('; ')}
Diagnósticos (correctDx): ${DX.map(d=>d.id+' = '+d.t).join('; ')}
Aparência do paciente (look): ${Object.entries(IA_LOOKS).map(([k,v])=>k+' = '+v).join('; ')}
Radiografia (rx): eff = tamanho do derrame por lado de 0,1 a 0,5; cardio: 1 se cardiomegalia; consol: "D" ou "E" se consolidação. Toracocentese (tap): lados com líquido e espaços intercostais de 1 a 8 contados de cima onde a agulha acha líquido.

FORMATO: responda só com um objeto JSON no mesmo formato deste caso de exemplo (é só o molde, não copie o conteúdo):
${JSON.stringify(exemplo)}

MATERIAL DO ALUNO
"""
${material||'(o material está nas fotos enviadas)'}
"""`;

async function iaGerar(){
 const texto=document.getElementById('iaTexto').value.trim().slice(0,60000);
 const arqs=[...document.getElementById('iaArq').files];
 const fotos=arqs.filter(f=>f.type.startsWith('image/'));
 let extra='';for(const f of arqs.filter(f=>!f.type.startsWith('image/')))extra+='\n\n'+(await f.text()).slice(0,60000);
 const material=(texto+extra).trim().slice(0,80000);
 if(!material&&!fotos.length){iaMsg('<div class="note">Cole um trecho do material ou escolha um arquivo.</div>');return;}
 if(fotos.length&&!IA.fotos){iaMsg('<div class="note">Fotos não estão disponíveis aqui. Use o texto.</div>');return;}
 const fonte=arqs.length?arqs.map(f=>f.name).join(', '):(material.split('\n').find(l=>l.trim())||'texto colado').slice(0,60);
 const qtd=+document.getElementById('iaQtd').value;
 const btn=document.getElementById('iaGerar'),parar=document.getElementById('iaParar');
 btn.disabled=true;parar.hidden=false;
 const feitos=[],novos=[],log=[];
 const mostra=atual=>iaMsg(log.map(l=>`<div class="${l.k}">${l.t}</div>`).join('')+(atual?`<div class="iawait">${atual}</div>`:''));
 try{
  for(let i=0;i<qtd;i++){
   IA.ctl=new AbortController();
   mostra(`Montando o caso ${i+1} de ${qtd}... (a IA pensa antes de escrever, pode levar 1 a 3 minutos)`);
   const opts={signal:IA.ctl.signal,modelTier:'complex',cache:false};if(fotos.length)opts.images=fotos;
   let resp=await IA.sample.json(iaPrompt(material,feitos,fotos.length>0),opts);
   if(resp&&resp.erro){log.push({k:'note',t:'A IA não montou o caso: '+String(resp.erro).replace(/</g,'‹')});break;}
   let v=iaValidar(resp,fonte);
   if(v.graves.length){ // uma chance de corrigir
    mostra(`O caso ${i+1} veio com problemas (${v.graves.join('; ')}). Pedindo correção...`);
    IA.ctl=new AbortController();
    resp=await IA.sample.json(iaPrompt(material,feitos,fotos.length>0)+`\n\nVOCÊ JÁ ENVIOU ESTE CASO:\n${JSON.stringify(resp)}\n\nELE TEM ESTES PROBLEMAS: ${v.graves.join('; ')}.\nDevolva o caso inteiro corrigido, só o JSON.`,Object.assign({},opts,{signal:IA.ctl.signal}));
    v=iaValidar(resp,fonte);
   }
   if(v.graves.length){log.push({k:'event',t:`Caso ${i+1} descartado: ${v.graves.join('; ')}.`});continue;}
   CASES.push(v.caso);novos.push(v.caso);feitos.push(DX.find(d=>d.id===v.caso.correctDx).t);
   iaGravar(CASES.filter(c=>c.ia));iaRenumerar();
   log.push({k:'okmsg',t:`Pronto: <b>${v.caso.title}</b> (${v.caso.pname}).`});
  }
 }catch(e){
  if(e&&e.code!=='cancelled')log.push({k:'event',t:IA_ERROS[e&&e.code]||'Não deu certo agora. Tente de novo em instantes.'});
  else log.push({k:'note',t:'Parado.'});
 }
 IA.ctl=null;
 if(novos.length){renderHome();iaMsg(log.map(l=>`<div class="${l.k}">${l.t}</div>`).join('')+'<p class="muted" style="margin-top:8px">Os casos novos estão no menu acima, marcados como IA.</p>');}
 else{mostra('');const b=document.getElementById('iaGerar'),p=document.getElementById('iaParar');if(b)b.disabled=false;if(p)p.hidden=true;}
}

function drawRX(cnv,rx){
 cnv.width=300;cnv.height=340;const g=cnv.getContext('2d');
 const sideX={D:92,E:208},dx=rx.shift==='D'?-24:rx.shift==='E'?24:0,dia=rx.hiper?318:300,ry=rx.hiper?128:118;

 g.fillStyle='#5a5e62';g.fillRect(40,20,220,40);
 const lungs=[[92,175+(rx.hiper?8:0),56,ry],[208,175+(rx.hiper?8:0),56,ry]];
 g.fillStyle=rx.hiper?'#070809':'#0d0f11';lungs.forEach(l=>{g.beginPath();g.ellipse(l[0],l[1],l[2],l[3],0,0,7);g.fill();});
 g.fillStyle='#b9bec2';g.fillRect(138+dx,40,24,280);
 g.fillStyle='rgba(205,210,214,.92)';g.beginPath();
 if(rx.cardio)g.ellipse(170+dx,232,82,56,0,0,7);else g.ellipse(162+dx,228,rx.hiper?40:52,rx.hiper?42:46,0,0,7);g.fill();
 g.fillStyle='#a6aaad';g.beginPath();g.ellipse(92,dia,64,rx.hiper?12:26,0,Math.PI,0);g.fill();g.beginPath();g.ellipse(208,dia+6,64,rx.hiper?12:24,0,Math.PI,0);g.fill();
 g.fillRect(28,dia,244,340-dia);
 g.filter='blur(1.5px)';
 g.strokeStyle=`rgba(225,228,230,${rx.hiper?.2:.33})`;g.lineWidth=5;
 for(let i=0;i<8;i++){const y=78+i*26;
  g.beginPath();g.moveTo(140+dx,y);g.quadraticCurveTo(70,y-10,40,y+24);g.stroke();
  g.beginPath();g.moveTo(160+dx,y);g.quadraticCurveTo(230,y-10,260,y+24);g.stroke();}
 g.lineWidth=7;g.strokeStyle='rgba(225,228,230,.5)';
 g.beginPath();g.moveTo(140+dx,62);g.lineTo(60,52);g.stroke();g.beginPath();g.moveTo(160+dx,62);g.lineTo(240,52);g.stroke();
 if(rx.congest){g.filter='blur(9px)';g.fillStyle='rgba(200,204,208,.42)';
  [[110,170,40,46],[190,170,40,46],[92,250,46,30],[208,252,46,30]].forEach(b=>{g.beginPath();g.ellipse(b[0]+dx,b[1],b[2],b[3],0,0,7);g.fill();});}
 if(rx.bronq){g.filter='blur(.8px)';g.strokeStyle='rgba(225,228,230,.55)';g.lineWidth=2;
  [[78,236],[96,252],[196,240],[214,256]].forEach(([x,y])=>{[0,6].forEach(o=>{g.beginPath();g.moveTo(x+o,y);g.lineTo(x+o-14,y+30);g.stroke();});});}
 g.filter='blur(4px)';
 Object.entries(rx.eff||{}).forEach(([s,sz])=>{
  const cx=sideX[s],lat=s==='D'?-1:1;const top=300-sz*230;
  g.save();g.beginPath();g.ellipse(150,200,132,168,0,0,7);g.clip();g.beginPath();g.rect(s==='D'?0:158,0,142,308);g.clip();
  const gr=g.createLinearGradient(0,top-30,0,top+60);gr.addColorStop(0,'rgba(178,182,186,.6)');gr.addColorStop(1,'rgba(170,174,178,1)');
  g.fillStyle=gr;g.beginPath();
  g.moveTo(cx-lat*70,340);g.lineTo(cx-lat*70,top+18);
  g.bezierCurveTo(cx-lat*20,top+20,cx+lat*30,top+8,cx+lat*70,top-44);g.lineTo(cx+lat*70,340);g.closePath();g.fill();g.restore();
 });
 if(rx.consol){const cx=sideX[rx.consol];g.fillStyle='rgba(200,204,208,.45)';
  [[0,190,24,18],[-14,206,16,12],[12,176,14,12]].forEach(b=>{g.beginPath();g.ellipse(cx+b[0],b[1],b[2],b[3],0,0,7);g.fill();});}
 if(rx.consolAp){const cx=sideX[rx.consolAp];g.fillStyle='rgba(200,204,208,.5)';
  [[0,104,30,22],[-10,122,18,14],[14,92,16,12]].forEach(b=>{g.beginPath();g.ellipse(cx+b[0],b[1],b[2],b[3],0,0,7);g.fill();});}
 if(rx.atel){const cx=sideX[rx.atel];g.save();g.beginPath();g.ellipse(cx,175,58,ry+4,0,0,7);g.clip();
  const gr=g.createLinearGradient(0,190,0,250);gr.addColorStop(0,'rgba(190,194,198,0)');gr.addColorStop(1,'rgba(190,194,198,.92)');
  g.fillStyle=gr;g.fillRect(cx-70,190,140,dia-190);g.restore();}
 if(rx.cav){const cx=sideX[rx.cav];g.filter='blur(2px)';g.fillStyle='rgba(200,204,208,.55)';g.beginPath();g.ellipse(cx,100,30,26,0,0,7);g.fill();
  g.fillStyle='#050607';g.beginPath();g.ellipse(cx,98,16,13,0,0,7);g.fill();}
 if(rx.ptx){const s=rx.ptx.lado,cx=sideX[s],lat=s==='D'?-1:1,tam=rx.ptx.tam||.3,w=56*tam*1.6;
  g.filter='blur(1px)';g.save();g.beginPath();g.ellipse(cx,175,58,ry+4,0,0,7);g.clip();
  g.fillStyle='#020303';g.beginPath();g.ellipse(cx+lat*56,175,w,ry+10,0,0,7);g.fill();
  g.strokeStyle='rgba(235,238,240,.75)';g.lineWidth=1.5;g.beginPath();g.ellipse(cx+lat*56,175,w,ry+10,0,0,7);g.stroke();g.restore();}
 g.filter='none';
 g.fillStyle='#e9eef0';g.fillRect(14,14,22,24);g.fillStyle='#030405';g.font='bold 18px monospace';g.textAlign='center';g.fillText('D',25,32);
 g.fillStyle='#8a9aa3';g.font='10px monospace';g.textAlign='right';g.fillText('PA · '+G.c.pname.toUpperCase(),290,330);
}

function examResult(id){

}

function toast(msg){const box=$('#toast');while(box.children.length>=2)box.firstChild.remove();const d=document.createElement('div');d.textContent=msg;box.appendChild(d);setTimeout(()=>d.remove(),3200);}
function advance(min){
 const b=G.clock;G.clock+=min;
 const done=Object.entries(G.orders).filter(([id,r])=>r>b&&r<=G.clock).map(([id])=>id);
 if(done.length)toast(done.length===1?'Resultado pronto: '+exName(done[0]):done.length+' resultados prontos no computador');
 const fl=Object.entries(G.fluid).filter(([id,r])=>r>b&&r<=G.clock);
 if(fl.length)toast('Chegou o laudo do líquido pleural');
 $('#hudClock').textContent=fmtT(G.clock);
}
function nextPending(){const all=[...Object.values(G.orders),...Object.values(G.fluid)].filter(r=>r>G.clock);return all.length?Math.min(...all):null;}

function findExam(tool,z){
 const c=G.c;
 if(z==='geral')return c.geral;
 const k=tool+':'+z;if(c.exam[k])return c.exam[k];
 if(/^(apice|medio|base)[DE]$/.test(z)){
  const side=z.slice(-1),eff=z.startsWith('base')&&c.effSides.includes(side);
  return {inspecionar:eff?'Expansibilidade reduzida deste lado.':'Expansibilidade simétrica, sem abaulamentos, retrações ou tiragem.',
   palpar:eff?'Expansibilidade reduzida. Frêmito toracovocal abolido.':'Expansibilidade preservada. Frêmito toracovocal presente e normal.',
   percutir:eff?'Som maciço.':'Som claro pulmonar.',
   auscultar:eff?'Murmúrio vesicular abolido. Ressonância vocal diminuída.':'Murmúrio vesicular presente, sem ruídos adventícios. Ressonância vocal normal.'}[tool];
 }
 const D={
  pescoco:{inspecionar:'Jugulares sem turgência a 45°.',palpar:'Sem linfonodos palpáveis. Refluxo hepatojugular negativo.',percutir:'Não ajuda aqui.',auscultar:'Sem sopros carotídeos.'},
  coracao:{inspecionar:'Ictus não visível.',palpar:'Ictus no 5º espaço intercostal, linha hemiclavicular.',percutir:'Não ajuda muito aqui.',auscultar:'Ritmo regular em 2 tempos, bulhas normofonéticas, sem sopros.'},
  abdome:{inspecionar:'Abdome plano.',palpar:'Flácido, indolor, sem visceromegalias.',percutir:'Timpânico, sem macicez móvel.',auscultar:'Ruídos hidroaéreos presentes.'},
  pernas:{inspecionar:'Sem edema.',palpar:'Sem edema, panturrilhas livres.',percutir:'Não se aplica.',auscultar:'Não se aplica.'},
  boca:{inspecionar:'Mucosas coradas e úmidas. Língua rósea.',palpar:'Não se aplica.',percutir:'Não se aplica.',auscultar:'Não se aplica.'},
  maos:{inspecionar:'Unhas com ângulo normal. Extremidades sem cianose.',palpar:'Mãos aquecidas, enchimento capilar normal.',percutir:'Não se aplica.',auscultar:'Não se aplica.'}
 };
 return D[z][tool];
}

function doTap(){

 if(!imaging&&!G.tapEv.some(e=>e.k==='noimg'))G.tapEv.push({k:'noimg',t:'Puncionou sem confirmar líquido livre por Laurell ou USG.',p:4});
 if(i===9){G.tapEv.push({k:'low',t:'Punção baixa demais: risco de atingir fígado, baço ou diafragma. Procedimento interrompido.',p:5});
  t.msg='<div class="event">Muito baixo. Você sentiu resistência e recuou. Abaixo do diafragma ficam fígado e baço. Nenhum líquido.</div>';return;}
 if(!c.tap.sides.includes(s)||!c.tap.spaces.includes(i)){G.tapEv.push({k:'dry'+G.tapAttempts,t:'Punção seca ('+i+'º espaço, lado '+(s==='D'?'direito':'esquerdo')+').',p:3});

 if(t.pos==='meio'){G.tapEv.push({k:'mid',t:'Agulha no meio do espaço: funcionou, mas o mais seguro é rente à borda superior da costela de baixo.',p:2});}
 if(t.vol==='2000'){G.tapEv.push({k:'reexp',t:'Retirou cerca de 2.000 mL: edema de reexpansão (tosse e queda da saturação).',p:5});msg+='<div class="event">Perto dos 2 litros o paciente começou a tossir sem parar e a saturação caiu. Edema de reexpansão.</div>';}
 G.tapped=true;t.msg=msg;

function score(){
 const c=G.c,f=G.final;
 const hit=(groups,arr)=>groups.filter(g=>g.ids.some(id=>arr.includes(id)));
 const qH=hit(c.keyQ,G.asked),eH=hit(c.keyExam,G.examined),xH=hit(c.keyEx,Object.keys(G.orders)),fH=hit(c.keyFluid||[],Object.keys(G.fluid));
 const keyIds=c.keyEx.flatMap(g=>g.ids);
 const extra=Object.keys(G.orders).filter(id=>!keyIds.includes(id)&&!c.neutral.includes(id));
 const pen=G.tapEv.reduce((s,e)=>s+e.p,0);
 const okT=c.conduta.filter(x=>x.ok).length,okH=c.conduta.filter(x=>x.ok&&f.cond.includes(x.id)).length,wr=c.conduta.filter(x=>!x.ok&&f.cond.includes(x.id)).length;
 const P=pesos(c),s={
  q:Math.round(P.q*qH.length/c.keyQ.length),
  ex:Math.round(P.ex*eH.length/c.keyExam.length),
  lab:Math.max(0,Math.round(P.lab*xH.length/c.keyEx.length)-2*extra.length),
  sind:f.sind===c.correctSind?P.sind:0,
  dx:f.dx===c.correctDx?P.dx:0,
  cond:Math.max(0,Math.round(P.cond*okH/okT)-4*wr)
 };
 if(ehPleural(c)){
  s.proc=G.tapped?Math.max(0,P.proc-pen):0;
  s.fl=Math.round(P.fl*fH.length/c.keyFluid.length);
  s.cls=f.cls===c.correctClass?P.cls:0;
 }
 s.total=Object.values(s).reduce((a,b)=>a+b,0);
 if(!ehPleural(c)){s.pen=pen;s.total=Math.max(0,s.total-pen);} // punção onde não há líquido também custa
 s.miss={q:c.keyQ.filter(g=>!qH.includes(g)),ex:c.keyExam.filter(g=>!eH.includes(g)),lab:c.keyEx.filter(g=>!xH.includes(g)),fl:ehPleural(c)?c.keyFluid.filter(g=>!fH.includes(g)):[]};
 s.extra=extra;return s;
}
function lightText(){

 return `Proteína ${nf(L.protL)}/${nf(L.protS)} = ${nf(rp.toFixed(2))} (${rp>.5?'> 0,5':'≤ 0,5'}) · DHL ${L.ldhL}/${L.ldhS} = ${nf(rl.toFixed(2))} (${rl>.6?'> 0,6':'≤ 0,6'}) · DHL do líquido ${L.ldhL} ${L.ldhL>133?'>':'≤'} 133 (2/3 de 200).`;
}

 const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
 const hit=Object.values(OBJ).find(o=>{const q=o.r;return x>=q[0]-10&&x<=q[0]+q[2]+10&&y>=q[1]-24&&y<=q[1]+q[3]+10;});
 if(hit){G.target={...hit.ip};G.pending=hit;}else{G.target={x,y};G.pending=null;}
 G.stuck=0;
});
$('#actBtn').addEventListener('click',()=>{if(G&&G.near&&!G.modal)interact(G.near);});

let last=performance.now();
function loop(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
 if(G&&!$('#game').hidden){
  let vx=0,vy=0;
  if(!G.modal){
   if(G.keys.u)vy-=1;if(G.keys.d)vy+=1;if(G.keys.l)vx-=1;if(G.keys.r)vx+=1;
   if(!vx&&!vy&&G.target){const dx=G.target.x-G.pos.x,dy=G.target.y-G.pos.y,dist=Math.hypot(dx,dy);
    if(dist<3){const p=G.pending;G.target=null;if(p){interact(p);}}else{vx=dx/dist;vy=dy/dist;}}
  }
  const mv=vx||vy;
  if(mv){const n=Math.hypot(vx,vy)||1,sp=78*dt;const nx=G.pos.x+vx/n*sp,ny=G.pos.y+vy/n*sp;let moved=false;
   if(!blocked(nx,G.pos.y)){G.pos.x=nx;moved=true;}if(!blocked(G.pos.x,ny)){G.pos.y=ny;moved=true;}
   if(Math.abs(vx)>Math.abs(vy))G.dir=vx<0?'left':'right';else G.dir=vy<0?'up':'down';
   if(!moved&&G.target){G.stuck=(G.stuck||0)+dt;if(G.stuck>.4){G.target=null;G.pending=null;}}}
  G.moving=!!mv;
  let near=null,best=30;Object.values(OBJ).forEach(o=>{const d=Math.hypot(o.ip.x-G.pos.x,o.ip.y-G.pos.y);if(d<best){best=d;near=o;}});
  G.near=near;
  const ab=$('#actBtn');if(near&&!G.modal){ab.hidden=false;ab.textContent=near.lbl();}else ab.hidden=true;
  ctx.imageSmoothingEnabled=false;
  drawRoom(t);
  const ents=[{y:G.pos.y,d:()=>drawPerson(G.pos.x,G.pos.y,LOOKS.doctor,t,G.moving,G.dir)},{y:238,d:()=>drawPerson(176,238,LOOKS.nurse,t,false,'up')}].sort((a,b)=>a.y-b.y);
  ents.forEach(e=>e.d());
  const unseenLab=Object.keys(G.orders).some(id=>id!=='rx'&&ready(id)&&!G.seen[id])||Object.keys(G.fluid).some(id=>fready(id)&&!G.seen['f_'+id]);
  if(unseenLab)drawBang(363,40,t);
  if(ready('rx')&&!G.seen.rx)drawBang(252,10+12,t);
  if(near&&!G.modal)drawPrompt(near);
 }
 requestAnimationFrame(loop);
}
renderHome();requestAnimationFrame(loop);
</script>
